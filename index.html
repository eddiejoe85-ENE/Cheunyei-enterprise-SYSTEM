<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進銷存系統</title>
<meta name="theme-color" content="#0F5C6E">
<style>
:root{
  color-scheme:light;
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#131C26; --ink2:#4A5866; --ink3:#78858F;
  --line:#D8DEE4; --soft:#F0F3F6;
  --brand:#0F5C6E; --brandi:#FFFFFF; --brands:#D9ECF0;
  --ok:#1E7F52; --low:#B06400; --zero:#B93A2B;
  --oks:#DDF1E6; --lows:#FBEBCF; --zeros:#F8DDD8; --b3:#C4531D; --b4:#85261B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141A; --panel:#171F27; --ink:#E7ECF1; --ink2:#AAB5C0; --ink3:#7E8B97;
    --line:#2A353F; --soft:#1F2932;
    --brand:#56B4C8; --brandi:#04212A; --brands:#173A44;
    --ok:#5CC98F; --low:#F0B04A; --zero:#F0806F;
    --oks:#18382A; --lows:#3B2E14; --zeros:#3F1F1B; --b3:#EE7A4F; --b4:#D8564A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --panel:#171F27; --ink:#E7ECF1; --ink2:#AAB5C0; --ink3:#7E8B97;
  --line:#2A353F; --soft:#1F2932;
  --brand:#56B4C8; --brandi:#04212A; --brands:#173A44;
  --ok:#5CC98F; --low:#F0B04A; --zero:#F0806F;
  --oks:#18382A; --lows:#3B2E14; --zeros:#3F1F1B; --b3:#EE7A4F; --b4:#D8564A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
small{font-size:12.5px;color:var(--ink3)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.i{display:inline-flex;width:22px;height:22px}.i svg{width:100%;height:100%}

/* layout */
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.page{padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:8px;gap:10px}
.top h1{font-size:20px;font-weight:700;letter-spacing:.02em}
.top-r{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft)}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--lows);color:var(--low);font-weight:600}
.ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--ink2)}
.ic:hover{background:var(--soft)}
.ic.sm{width:32px;height:32px}
.ic .i{width:20px;height:20px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--ink3)}
.nav button[aria-current="page"]{color:var(--brand);font-weight:700}
@media (min-width:900px){
  .nav{top:0;right:auto;bottom:0;width:190px;flex-direction:column;justify-content:flex-start;gap:4px;
    border-top:0;border-right:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 10px 10px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:10px;text-align:left}
  .nav button[aria-current="page"]{background:var(--brands)}
  #app{margin-left:190px}
  .page{padding-bottom:40px}
}

/* sections and panels */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px;min-height:34px}
.sec-h h2{font-size:14px;font-weight:700;color:var(--ink2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;padding:12px 14px}
.row + .row{border-top:1px solid var(--line)}
button.row:hover{background:var(--soft)}
.row b{font-weight:600}
.row.void{opacity:.55}
.row.void b{text-decoration:line-through}
.empty{padding:28px 18px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink2);font-size:13.5px;margin:0 0 12px}
.note.bad{background:var(--zeros);color:var(--zero)}
.note.warn{background:var(--lows);color:var(--low)}
.right{text-align:right}
.lg{font-size:17px;font-weight:700}

/* stock gauge */
.gauge{position:relative;display:block;height:6px;border-radius:3px;background:var(--soft);margin-top:7px;grid-column:1/-1}
.gauge i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.gauge.low i{background:var(--low)}.gauge.zero i{background:var(--zero)}
.gauge b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink3);opacity:.55}
.qty{font-size:18px;font-weight:700}
.qty.low{color:var(--low)}.qty.zero{color:var(--zero)}
.tag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;flex:none}
.tag.in{background:var(--oks);color:var(--ok)}
.tag.out{background:var(--lows);color:var(--low)}
.tag.adj{background:var(--soft);color:var(--ink2)}
.tag.due{background:var(--zeros);color:var(--zero);margin-left:6px}

/* hero */
.hero{padding:16px}
.hero h2{font-size:14px;font-weight:700;color:var(--ink2)}
.strip{display:flex;gap:3px;height:16px;margin:12px 0}
.strip i{display:block;border-radius:4px;min-width:6px}
.strip .ok{background:var(--ok)}.strip .low{background:var(--low)}.strip .zero{background:var(--zero)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend button{padding:8px 10px;border-radius:10px;background:var(--soft)}
.legend b{display:block;font-size:22px;line-height:1.2}
.legend small{display:flex;align-items:center;gap:6px}
.legend small::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.legend .ok b,.legend .ok small{color:var(--ok)}.legend .low b,.legend .low small{color:var(--low)}.legend .zero b,.legend .zero small{color:var(--zero)}

.strip .a0{background:var(--ok)}.strip .a1{background:var(--low)}.strip .a2{background:var(--b3)}.strip .a3{background:var(--zero)}.strip .a4{background:var(--b4)}
.age-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.age-row .sw{width:10px;height:10px;border-radius:3px}
.age-row .a0{background:var(--ok)}.age-row .a1{background:var(--low)}.age-row .a2{background:var(--b3)}.age-row .a3{background:var(--zero)}.age-row .a4{background:var(--b4)}
.overdue{color:var(--zero)!important;font-weight:600}
.soon{color:var(--low)!important;font-weight:600}
/* stocktake */
.scanbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--brand);border-radius:12px;padding:0 12px;color:var(--brand)}
.scanbox input{flex:1;min-width:0;height:54px;border:0;background:none;color:var(--ink);font:inherit;font-size:18px;outline:none}
.stat{min-height:22px;font-size:14px;margin:8px 2px 0;color:var(--ink2)}
.stat.ok{color:var(--ok);font-weight:600}.stat.bad{color:var(--zero);font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .in{width:110px;text-align:center;font-size:24px;font-weight:700;height:56px}
.stepper .btn{width:56px;height:56px;padding:0;font-size:26px}
.sync{white-space:nowrap}
.diff-up{color:var(--ok)}.diff-dn{color:var(--zero)}
.cam{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.cam .reticle{position:absolute;left:10%;right:10%;top:32%;height:28%;border:2px solid rgba(255,255,255,.9);border-radius:12px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
.cam-bot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.8);color:#fff}
.cam-msg.ok{color:#7be0a8}.cam-msg.bad{color:#ff9a8a}
button.note{display:block;width:100%;text-align:left;color:var(--ink)}
.sg{display:grid;grid-template-columns:auto 1fr 92px;gap:10px;align-items:center;padding:12px 14px}
.sg + .sg{border-top:1px solid var(--line)}
.sg input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
/* forms */
.in{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
textarea.in{height:auto;padding:10px 12px;min-height:76px;resize:vertical}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brands)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--ink3)}
.search input{flex:1;min-width:0;height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none}
.f{margin:0 0 14px}
.f > label{display:block;font-size:13px;color:var(--ink2);margin:0 0 6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{height:44px;padding:0 18px;border-radius:10px;background:var(--brand);color:var(--brandi);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--zero);color:#fff}
.btn.plain{background:transparent;color:var(--zero)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.grow{flex:1}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* key/value + lines */
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink2);flex:none}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dhead .big{font-size:18px;display:block}
.bigqty{font-size:34px;font-weight:700;line-height:1.1}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px}
.mv + .mv{border-top:1px solid var(--line)}
.mv.void{opacity:.5;text-decoration:line-through}
.bar{display:block;height:5px;border-radius:3px;background:var(--brands);margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.ledger .row span:first-child{color:var(--ink2)}
.ledger .row span:last-child{text-align:right;font-weight:600}

/* order editor */
.ln{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.ln-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ln-h b{display:block;font-weight:600}
.ln-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.ln-g.adj{grid-template-columns:1fr 1fr}
.ln-g label{display:block;font-size:12px;color:var(--ink3);margin-bottom:4px}
.ln-g .in{height:40px}
.ln-s{text-align:right;padding-bottom:9px}
.ln-s small{display:block}
.warn{display:block;margin-top:6px;color:var(--zero);font-size:12.5px}
.hint{display:block;margin-top:6px;color:var(--ink3);font-size:12.5px}
.warn:empty,.hint:empty{display:none}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;overflow:hidden}
.pick:empty{display:none}
.pick .row{grid-template-columns:1fr auto}

/* sheets, dialogs, toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,22,.5);display:flex;align-items:stretch;justify-content:center}
.sheet{background:var(--bg);width:100%;display:flex;flex-direction:column;min-height:0}
.sheet-h{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.sheet-t{flex:1;min-width:0}
.sheet-t h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{flex:1;overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.sheet-f:empty{display:none}
.sheet-f .tot{flex:1;font-size:17px;font-weight:700}
@media (min-width:720px){
  .scrim{align-items:center;padding:24px}
  .sheet{max-width:640px;max-height:90vh;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .sheet-h{padding-top:8px}.sheet-f{padding-bottom:10px}
}
.dlg-scrim{position:fixed;inset:0;z-index:70;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--panel);border-radius:16px;padding:20px;max-width:360px;width:100%}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg p{color:var(--ink2);margin-bottom:16px;overflow-wrap:anywhere}
.dlg .btns{justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);pointer-events:none}
@media (min-width:900px){.toast{bottom:28px}}
.loading{padding:80px 20px;text-align:center;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:12px 6px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px}
.tile svg{width:30px;height:30px;color:var(--brand)}
.tile.pri{background:var(--brand);color:var(--brandi);border-color:var(--brand)}.tile.pri svg{color:var(--brandi)}
details.fold{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:10px 0}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'＋';color:var(--ink3);font-weight:400}
details.fold[open]>summary::after{content:'－'}
.fold-b{padding:2px 14px 12px}
.mrow small.chev{font-size:20px;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app"></div>
<nav class="nav" id="nav" aria-label="主選單"></nav>
<div id="layer"></div>

/* ================= 狀態 ================= */
const S = {

function rangeOf(k){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();

  if (k === 'month') return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];

function h(tag, props, ...kids){
  const e = document.createElement(tag);

  for (const c of kids.flat(Infinity)){

    e.append(c.nodeType ? c : document.createTextNode(String(c)));

    const v = props[k];

    if (k.startsWith('aria-')){ if (v != null) e.setAttribute(k, String(v)); continue; }

function recompute(){
  const stock = {}, stockW = {}, bal = {}, usedP = new Set(), usedPt = new Set();
  const addW = (pid, wid, q) => { const m = stockW[pid] || (stockW[pid] = {}); m[wid] = r3((m[wid] || 0) + q); };
  for (const o of Object.values(S.orders)){
    for (const l of o.lines || []) usedP.add(l.pid);
    if (o.partnerId) usedPt.add(o.partnerId);
    if (o.status === 'void') continue;
    const T = TYPES[o.type]; if (!T) continue;
    if (o.type === 'transfer'){ for (const l of o.lines || []){ const q = Number(l.qty) || 0; addW(l.pid, o.whFrom || WH_MAIN, -q); addW(l.pid, o.whTo || WH_MAIN, q); } }
    else for (const l of o.lines || []){ const q = T.sign * (l.sgn || 1) * (Number(l.qty) || 0); stock[l.pid] = r3((stock[l.pid] || 0) + q); addW(l.pid, o.wh || WH_MAIN, q); }
    if (o.partnerId && T.money) bal[o.partnerId] = r2((bal[o.partnerId] || 0) + T.money * ((Number(o.total) || 0) - (Number(o.paid) || 0)));
  }
  const alloc = {};
  for (const pm of Object.values(S.payments)){
    if (pm.status === 'void') continue;
    for (const a of pm.allocations || []) alloc[a.orderId] = r2((alloc[a.orderId] || 0) + (Number(a.amount) || 0));
    const pt = S.partners[pm.partnerId]; if (!pt) continue;
    const eff = ((pt.type === 'customer' && pm.dir === 'in') || (pt.type === 'supplier' && pm.dir === 'out')) ? -1 : 1;
    bal[pm.partnerId] = r2((bal[pm.partnerId] || 0) + eff * ((Number(pm.amount) || 0) + (Number(pm.discount) || 0) + (Number(pm.extra) || 0)));
  }
  const cats = [...new Set(Object.values(S.products).map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-TW'));
  const fill = {}, lastSup = {}, lastKey = {};
  for (const o of Object.values(S.orders)){
    if (o.status === 'void') continue;
    if (o.srcId){ const m = fill[o.srcId] || (fill[o.srcId] = {}); for (const l of o.lines || []) m[l.pid] = r3((m[l.pid] || 0) + Number(l.qty || 0)); }
    if (o.type === 'purchase' && o.partnerId){
      const k = (o.date || '') + '|' + String(o.at || 0).padStart(15, '0');
      for (const l of o.lines || []) if (!lastKey[l.pid] || k > lastKey[l.pid]){ lastKey[l.pid] = k; lastSup[l.pid] = o.partnerId; }
    }
  }
  const vehOdo = {};
  for (const f of Object.values(S.fuellogs)) if (f.odo) vehOdo[f.vehicleId] = Math.max(vehOdo[f.vehicleId] || 0, f.odo);
  for (const m of Object.values(S.maint)) if (m.odo) vehOdo[m.vehicleId] = Math.max(vehOdo[m.vehicleId] || 0, m.odo);
  S.d = {stock, stockW, vehOdo, bal, alloc, fill, commit:{}, incoming:{}, lastSup, usedP, usedPt, cats};
  for (const [kind, coll, tgt] of [['co', 'corders', 'commit'], ['po', 'porders', 'incoming']]){
    for (const d of Object.values(S[coll])){
      const pr = docProgress(kind, d);
      if (pr.active) for (const l of pr.lines) if (l.rem > 0) S.d[tgt][l.pid] = r3((S.d[tgt][l.pid] || 0) + l.rem);
    }
  }
}

function level(p){

function summarize(from, to){
  const r = {sale:0, purchase:0, profit:0, count:0, items:{}};
  for (const o of Object.values(S.orders)){
    if (o.status === 'void' || !o.date || o.date < from || o.date > to) continue;
    const t = o.type;
    if (t === 'sale' || t === 'sale_return'){
      const k = t === 'sale' ? 1 : -1;
      r.sale += k * netOf(o); r.count++;
      const inclF = (o.taxMode === 'incl' && o.taxType === 'taxable') ? 1 + taxRate() / 100 : 1;
      for (const l of o.lines || []){
        const pr = (l.price || 0) / inclF;
        r.profit += k * (pr - (l.cost || 0)) * (l.qty || 0);
        const it = r.items[l.pid] || (r.items[l.pid] = {name:l.name, qty:0, amt:0});
        it.qty += k * (l.qty || 0); it.amt += k * pr * (l.qty || 0);
      }
    } else if (t === 'purchase' || t === 'purchase_return'){
      r.purchase += (t === 'purchase' ? 1 : -1) * netOf(o); r.count++;
    }
  }
  r.sale = r2(r.sale); r.purchase = r2(r.purchase); r.profit = r2(r.profit);
  r.disc = r2(Object.values(S.payments).filter(pm => pm.status !== 'void' && pm.dir === 'in' && pm.date >= from && pm.date <= to).reduce((a, pm) => a + (pm.discount || 0) + (pm.extra || 0), 0));
  return r;
}

const TAB_ID = 'tab-' + Math.random().toString(36).slice(2, 8);
let serialChain = Promise.resolve();
function nextSerialNo(pref, date){ const p = serialChain.then(() => nextSerialRaw(pref, date)); serialChain = p.catch(() => {}); return p; }
async function nextSerialRaw(pref, date){
  const key = pref + date.slice(2).replace(/-/g, ''), fmt = n => key + '-' + String(n).padStart(3, '0');
  const localMax = () => { let m = 0; for (const o of Object.values(S.orders)){ if (typeof o.no === 'string' && o.no.startsWith(key + '-')){ const t = o.no.slice(key.length + 1); if (/^\d{3,}$/.test(t)) m = Math.max(m, Number(t)); } } return m; };
  if (S.db && typeof S.db.nextSerial === 'function'){ try { return fmt(await S.db.nextSerial('counters/' + key, localMax())); } catch (_) {} }
  let ref = null; try { ref = S.db.doc('counters/' + key); } catch (_) {}
  if (ref && typeof ref.acquire === 'function'){
    const holder = (S.meId || 'u') + ':' + TAB_ID;
    for (let i = 0; i < 6; i++){
      let r; try { r = await ref.acquire({holder, ttlMs:1000}); } catch (_) { break; }
      if (r && r.acquired){
        try {
          const snap = await ref.get(), last = snap.exists ? Number((snap.data() || {}).last) || 0 : 0, next = Math.max(last, localMax()) + 1;
          if (snap.exists) await ref.update({last:next}); else await ref.set({last:next});
          return fmt(next);
        } catch (_) { break; }
      }
      const wait = r && r.expiresAt ? Math.min(Math.max(new Date(r.expiresAt).getTime() - Date.now(), 100), 1500) : 400;
      await new Promise(res => setTimeout(res, wait + 30));
    }
  }
  let n = localMax() + 1; while (Object.values(S.orders).some(o => o.no === fmt(n))) n++;
  return fmt(n);
}

async function createOrder(type, o){
  const T = TYPES[type];
  const date = o.date || today();
  if (S.set.closeDate && date <= S.set.closeDate) throw new Error('庫存已關帳至 ' + S.set.closeDate + '，不能建立 ' + S.set.closeDate + ' 以前的單據');
  const stockBefore = {}; if (type === 'purchase') for (const l of o.lines || []) stockBefore[l.pid] = stockOf(l.pid);
  const doc = {no:type === 'sale' ? await nextSerialNo(T.pref, date) : T.pref + date.slice(2).replace(/-/g, '') + '-' + rid(), type, date, partnerId:o.partnerId || null, lines:o.lines,
    total:o.total || 0, paid:o.paid || 0, note:o.note || '', status:'posted', by:S.meId || null, at:Date.now(), ...(o.extra || {})};
  if (o.tax){ doc.net = o.tax.net; doc.tax = o.tax.tax; doc.taxType = o.tax.type; doc.taxMode = o.tax.mode; }
  const ref = S.db.collection('orders').doc();
  await ref.set(doc);
  if (type === 'purchase') { try { await autoCost(doc, stockBefore); } catch (e) { console.error(e); } }
  return {...doc, id:ref.id};
}

async function voidOrder(o, sh){
  const T = TYPES[o.type];
  if (S.set.closeDate && o.date <= S.set.closeDate) return toast('庫存已關帳至 ' + S.set.closeDate + '，這張單據不能作廢');

  if (!S.set.allowNeg){
    for (const l of o.lines || []){
      if (o.type === 'transfer'){ const after = stockAt(l.pid, o.whTo) - l.qty; if (after < 0) return toast('作廢後「' + l.name + '」在 ' + whName(o.whTo) + ' 會變成 ' + num(after) + '，無法作廢'); continue; }

    }
  }
  if (!await dialog({title:'作廢 ' + o.no + '？', msg:'作廢後會還原庫存與帳款，且無法復原。要更正請作廢後重新開單。', ok:'作廢', danger:true})) return;
  const ok = await run(async () => { await S.db.doc('orders/' + o.id).update({status:'void', voidBy:S.meId || null, voidAt:Date.now()}); return true; });
  if (ok) toast('已作廢');
}

function csvText(rows){
  const cell = c => {
    if (c == null) return '';
    let s = String(c);
    if (typeof c === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
async function saveFile(filename, text){
  if (!S.dl){ toast('目前的環境無法下載檔案'); return false; }
  try { await S.dl.save({filename, data:text}); toast('已儲存 ' + filename); return true; }
  catch (e) { if (!e || e.code !== 'declined') toast('無法儲存：' + ((e && (e.message || e.code)) || '未知錯誤')); return false; }
}

/* ================= 帳款：收付款 / 帳齡 ================= */
const PAY = {in:{label:'收款', pref:'RC'}, out:{label:'付款', pref:'PM'}};
const METHODS = {cash:'現金', transfer:'轉帳', note:'票據', discount:'折讓', other:'其他'};
const AGE_LABELS = ['未到期', '逾期 1–30 天', '逾期 31–60 天', '逾期 61–90 天', '逾期 90 天以上'];
const ageIdx = late => late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;

function aging(type){
  const byP = {}, tot = [0, 0, 0, 0, 0], t = today();
  for (const o of Object.values(S.orders)){
    if (o.status === 'void' || !o.partnerId) continue;
    const T = TYPES[o.type]; if (!T || T.money !== 1) continue;
    const pt = S.partners[o.partnerId]; if (!pt || pt.type !== type) continue;
    const due = dueOf(o); if (due <= 0.004) continue;
    const i = ageIdx(daysBetween(dueDateOf(o), t));
    const r = byP[o.partnerId] || (byP[o.partnerId] = {b:[0, 0, 0, 0, 0], open:0});
    r.b[i] = r2(r.b[i] + due); r.open = r2(r.open + due); tot[i] = r2(tot[i] + due);
  }
  return {byP, tot, open:r2(tot.reduce((a, b) => a + b, 0))};
}
const lateOf = b => r2(b.slice(1).reduce((a, x) => a + x, 0));

function allocPanel(){
  let rows = [], pid = null, cb = () => {};
  const list = h('div');
  const openOrders = () => Object.values(S.orders).filter(o => o.partnerId === pid && o.status !== 'void' && TYPES[o.type] && TYPES[o.type].money === 1 && dueOf(o) > 0.004)
    .sort((a, b) => (a.date || '').localeCompare(b.date || '') || ((a.at || 0) - (b.at || 0)));
  function build(){
    rows = openOrders().map(o => ({o, due:dueOf(o), inp:h('input', {class:'in', type:'text', inputmode:'decimal', placeholder:'0', 'aria-label':'沖銷 ' + o.no,
      onfocus:e => e.target.select(), oninput:() => { api.manual = true; cb(); }})}));
    setKids(list, rows.length ? rows.map(r => h('div', {class:'ln', style:'display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center'},
      h('div', null, h('b', {text:r.o.no}), h('br'), h('small', {text:r.o.date + '，未結 ' + money(r.due)})), r.inp,
      h('button', {class:'btn ghost sm', 'aria-label':'全額沖銷 ' + r.o.no, onclick:() => { r.inp.value = r.due; api.manual = true; cb(); }}, '全額')))
      : h('div', {class:'note', text:pid ? '這個對象沒有未結單據，金額會記為預收款。' : '請先選擇對象。'}));
  }
  const api = {el:list, manual:false,
    onchange(f){ cb = f; },
    setPartner(p){ pid = p || null; api.manual = false; build(); cb(); },
    auto(amount, first){
      api.manual = false; let left = r2(amount);
      rows.forEach(r => { r.inp.value = ''; });
      for (const r of [...rows].sort((a, b) => (b.o.id === first ? 1 : 0) - (a.o.id === first ? 1 : 0))){
        const v = Math.min(left, r.due);
        if (v > 0.004){ r.inp.value = v; left = r2(left - v); }
      }
      cb();
    },
    sum(){ return r2(rows.reduce((a, r) => a + toNum(r.inp.value), 0)); },
    list(){ return rows.map(r => ({orderId:r.o.id, orderNo:r.o.no, amount:r2(toNum(r.inp.value)), due:r.due})).filter(x => x.amount > 0.004); }
  };
  return api;
}
function checkAlloc(alloc, amount, label){
  for (const a of alloc.list()) if (a.amount > a.due + 0.004) return '「' + a.orderNo + '」沖銷金額超過未結金額（' + money(a.due) + '）';
  if (alloc.sum() > amount + 0.004) return '沖銷總額超過' + label + '金額';
  return '';
}

const discRates = () => { const a = S.set.discountRates; return (Array.isArray(a) && a.length ? a : [3, 5]).map(Number).filter(v => v > 0 && v < 100); };
const payTol = () => { const n = Number(S.set.payTol); return isFinite(n) && n >= 0 ? n : 1; };
const partnerDisc = pid => Number((S.partners[pid] || {}).discount) || 0;
const discAmt = (gross, pct) => pct > 0 ? mInt(gross * pct / 100) : 0;
const settleOf = pm => (Number(pm.amount) || 0) + (Number(pm.discount) || 0) + (Number(pm.extra) || 0);
function grossFromCash(cash, pct){
  if (!(pct > 0)) return cash;
  const base = Math.floor(cash / (1 - pct / 100));
  for (let g = base - 1; g <= base + 2; g++) if (g >= 0 && r2(g - discAmt(g, pct)) === r2(cash)) return g;
  return Math.round(cash / (1 - pct / 100));
}
const AUDIT_TXT = {ok:'相符', over:'多收', short:'短收（列為額外折讓）', prepay:'預收款'};

function discountAudit(cfg){
  const D = {pct:0, touched:false, accept:false, reason:''};
  const enabled = cfg.type === 'customer';
  const el = h('div', {style:enabled ? '' : 'display:none'});
  if (!enabled) return {el, D, refresh(){}, result:() => ({pct:0, discount:0, extra:0, expect:0, diff:0, audit:'ok', reason:'', valid:true, gross:cfg.alloc.sum(), settle:mInt(toNum(cfg.getCash()))}), setPartner(){}, gross:c => c};
  const chipsBox = h('div', {class:'chips', style:'padding-top:0'}), auditBox = h('div');
  const customIn = h('input', {class:'in', type:'text', inputmode:'decimal', placeholder:'自訂 %', 'aria-label':'自訂折讓比例', style:'width:96px;height:34px;flex:none', onchange:e => { const v = toNum(e.target.value); if (v >= 0 && v < 100){ D.pct = v; D.touched = true; D.accept = false; paintChips(); cfg.rerun(); } e.target.value = ''; }});
  const rates = () => [...new Set([0, ...discRates(), D.pct])].sort((a, b) => a - b);
  function paintChips(){
    setKids(chipsBox, ...rates().map(r => h('button', {class:'chip', 'aria-pressed':D.pct === r, onclick:() => { D.pct = r; D.touched = true; D.accept = false; paintChips(); cfg.rerun(); }}, r ? r + '%' : '無折讓')), customIn);
  }
  const state = () => {
    const G = cfg.alloc.sum(), cash = mInt(toNum(cfg.getCash())), disc = discAmt(G, D.pct), expect = r2(G - disc), diff = r2(cash - expect), tol = payTol();
    let audit = 'ok', extra = 0, valid = true, msg = '';
    if (!(G > 0)){ audit = 'prepay'; }
    else if (Math.abs(diff) <= tol + 1e-9){ audit = 'ok'; if (diff < 0) extra = -diff; }
    else if (diff > 0){ audit = 'over'; }
    else { audit = 'short'; extra = -diff; if (!D.accept || !D.reason.trim()){ valid = false; msg = '實收金額比應收少 ' + money(-diff) + '，請改為部分沖銷，或勾選「列為額外折讓」並填寫原因。'; } }
    const settle = cash + disc + extra;
    if (G > settle + 1e-6){ valid = false; msg = msg || '沖銷合計超過實收金額加折讓。'; }
    return {pct:D.pct, discount:disc, extra, expect, diff, audit, reason:audit === 'short' ? D.reason.trim() : '', valid, msg, gross:G, settle, cash};
  };
  function refresh(){
    const r = state(), pending = r.audit === 'short';
    const cls = r.audit === 'ok' ? 'ok' : (r.audit === 'over' ? 'warn' : (r.audit === 'short' ? 'bad' : ''));
    const badge = r.audit === 'ok' ? '✓ 金額相符' + (r.diff ? '（差 ' + money(r.diff) + '，在允許誤差內）' : '') : (r.audit === 'over' ? '⚠ 多收 ' + money(r.diff) + '，多收的部分會記為預收款' : (r.audit === 'short' ? '⚠ 短收 ' + money(-r.diff) : '尚未選擇沖銷單據，整筆記為預收款'));
    setKids(auditBox, r.gross > 0 || cfg.getCash() ? h('div', {class:'panel pad', style:'margin-top:8px'},
      kv('沖銷金額合計', money(r.gross)),
      kv('折讓' + (D.pct ? '（' + D.pct + '%）' : ''), r.discount ? '−' + money(r.discount) : money(0)),
      kv('應收現金', money(r.expect)), kv('實收金額', money(r.cash)),
      h('div', {class:'note ' + (cls === 'ok' ? '' : cls), style:'margin:8px 0 0;' + (cls === 'ok' ? 'background:var(--oks);color:var(--ok)' : ''), text:badge}),
      pending ? h('div', {style:'margin-top:8px'},
        h('button', {class:'btn ghost sm', onclick:() => { D.accept = false; D.reason = ''; cfg.partial(); }}, '依實收金額改為部分沖銷'),
        h('label', {class:'check'}, h('input', {type:'checkbox', checked:D.accept, 'aria-label':'差額列為額外折讓', onchange:e => { D.accept = e.target.checked; refresh(); }}), '差額 ' + money(-r.diff) + ' 列為額外折讓（視同客戶另有折讓）'),
        D.accept ? h('input', {class:'in', placeholder:'請填寫原因（必填）', value:D.reason, 'aria-label':'額外折讓原因', oninput:e => { D.reason = e.target.value; }, onchange:() => refresh()}) : null) : null) : null);
    cfg.onaudit && cfg.onaudit(r);
  }
  put(el, h('div', {class:'f', style:'margin-top:10px'}, h('label', {text:'收款折讓（客戶預設可在客戶資料設定）'}), chipsBox), auditBox);
  paintChips();
  return {el, D, refresh, result:state, gross:c => grossFromCash(c, D.pct),
    setPartner(pid){ if (!D.touched){ D.pct = partnerDisc(pid); paintChips(); } D.accept = false; }};
}

async function createPayment(o){
  const date = o.date || today();
  const doc = {no:PAY[o.dir].pref + date.slice(2).replace(/-/g, '') + '-' + rid(), dir:o.dir, partnerId:o.partnerId, date, amount:o.amount,
    method:o.method, noteId:o.noteId || null, allocations:o.allocations || [], note:o.note || '', status:'posted', by:S.meId || null, at:Date.now()};
  const a = o.audit;
  if (a && (a.pct || a.discount || a.extra || a.audit !== 'ok')){ doc.pct = a.pct || 0; doc.discount = a.discount || 0; doc.extra = a.extra || 0; doc.expect = a.expect || 0; doc.diff = a.diff || 0; doc.audit = a.audit; if (a.reason) doc.auditNote = a.reason; }
  const ref = o.ref || S.db.collection('payments').doc();
  await ref.set(doc);
  return {id:ref.id, doc};
}

function exportStatement(pid){
  const pt = S.partners[pid]; if (!pt) return;
  const ent = [];
  for (const o of Object.values(S.orders)){
    if (o.partnerId !== pid || o.status === 'void') continue;
    const T = TYPES[o.type]; if (!T || !T.money) continue;
    const a = r2(T.money * ((o.total || 0) - (o.paid || 0)));
    if (a) ent.push({date:o.date, at:o.at || 0, no:o.no, memo:T.label, amt:a, bm:billMonth(o.date, cutoffOf(pt))});
  }
  for (const pm of Object.values(S.payments)){
    if (pm.partnerId !== pid || pm.status === 'void') continue;
    const eff = ((pt.type === 'customer' && pm.dir === 'in') || (pt.type === 'supplier' && pm.dir === 'out')) ? -1 : 1;
    if (pm.amount) ent.push({date:pm.date, at:pm.at || 0, no:pm.no, memo:PAY[pm.dir].label + '（' + (METHODS[pm.method] || '') + '）', amt:r2(eff * pm.amount)});
    if ((pm.discount || 0) + (pm.extra || 0) > 0) ent.push({date:pm.date, at:(pm.at || 0) + 1, no:pm.no, memo:'收款折讓' + (pm.pct ? ' ' + pm.pct + '%' : ''), amt:r2(eff * ((pm.discount || 0) + (pm.extra || 0)))});
  }
  ent.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  let running = 0; const rows = [['對象', pt.name], ['日期', '單號', '摘要', '增加', '減少', '餘額', '帳期']];
  for (const e of ent){ running = r2(running + e.amt); rows.push([e.date, e.no, e.memo, e.amt > 0 ? e.amt : '', e.amt < 0 ? -e.amt : '', running, e.bm || '']); }
  return saveFile('對帳單_' + pt.name + '_' + today() + '.csv', csvText(rows));
}

function findByCode(code){
  const c = String(code || '').trim().toLowerCase();
  if (!c) return null;
  const ps = activeProducts();
  const eq = (p, v) => [p.sku, p.barcode].some(x => x && String(x).toLowerCase() === v);
  let p = ps.find(p => eq(p, c));
  if (!p && /^\d+$/.test(c)){
    const z = c.replace(/^0+/, '');
    if (z) p = ps.find(p => [p.sku, p.barcode].some(x => x && /^\d+$/.test(String(x)) && String(x).replace(/^0+/, '') === z));
  }
  return p || null;
}
let audioCtx;
function beep(good){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const tone = (f, st, d) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.value = 0.05; o.connect(g); g.connect(audioCtx.destination); o.start(t + st); o.stop(t + st + d); };
    if (good) tone(1200, 0, 0.07); else { tone(300, 0, 0.12); tone(220, 0.16, 0.18); }
    if (navigator.vibrate) navigator.vibrate(good ? 20 : [60, 40, 60]);
  } catch (_) {}
}
const scopeOf = sess => activeProducts().filter(p => !sess.cat || p.category === sess.cat);
function countTotals(sid, myDocId, myItems){
  const tot = {}, by = {};
  const feed = (uid, items) => {
    let qty = 0, n = 0;
    for (const [pid, q] of Object.entries(items || {})){ if (q == null) continue; tot[pid] = r3((tot[pid] || 0) + Number(q)); qty += Number(q); n++; }
    by[uid] = {items:n, qty:r3(qty)};
  };
  for (const [id, cl] of Object.entries(S.countlines)){ if (cl.sid !== sid || id === myDocId) continue; feed(cl.uid, cl.items); }
  if (myDocId) feed(myDocId.slice(sid.length + 1), myItems);
  return {tot, by};
}

const ZX_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const ZX_SRI = 'sha384-BzBxP10ZE72aitqj5UMmUsbKFliP/DZqA8Wq+BNNhlIJDGoEd1tpkMYXOg9+n6sB';
function loadZXing(){
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = ZX_URL; s.integrity = ZX_SRI; s.crossOrigin = 'anonymous';
    s.onload = () => window.ZXing ? res(window.ZXing) : rej(new Error('zxing')); s.onerror = () => rej(new Error('load'));
    document.head.append(s);
  });
}
async function decodeImage(file){
  if ('BarcodeDetector' in window){
    try { const r = await new BarcodeDetector().detect(await createImageBitmap(file)); if (r.length) return r.map(x => x.rawValue); } catch (_) {}
  }
  const Z = await loadZXing(), url = URL.createObjectURL(file);
  try {
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const res = await new Z.BrowserMultiFormatReader(hints).decodeFromImageUrl(url);
    return [res.getText()];
  } finally { URL.revokeObjectURL(url); }
}
async function openCamera(onCode){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !('BarcodeDetector' in window)) return toast('這個裝置不支援相機即時掃描，請改用「拍照」或掃碼槍');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }
  catch (e) { return toast('無法開啟相機，請允許相機權限，或改用「拍照」'); }
  const video = h('video', {playsinline:'', autoplay:''}); video.muted = true; video.srcObject = stream;
  const msg = h('div', {class:'cam-msg', text:'把條碼對準框內'});
  const det = new BarcodeDetector();
  let last = '', lastT = 0, busy = false;
  const close = () => { clearInterval(iv); stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  const ov = h('div', {class:'cam', role:'dialog', 'aria-label':'相機掃描'}, video, h('div', {class:'reticle'}),
    h('div', {class:'cam-top'}, h('button', {class:'btn', onclick:close}, '完成')), h('div', {class:'cam-bot'}, msg));
  document.body.append(ov); video.play().catch(() => {});
  const iv = setInterval(async () => {
    if (busy || video.readyState < 2) return;
    busy = true;
    try {
      const r = await det.detect(video);
      if (r.length){
        const c = r[0].rawValue, now = Date.now();
        if (c !== last || now - lastT > 1800){ last = c; lastT = now; const out = onCode(c); msg.textContent = out.msg; msg.className = 'cam-msg ' + (out.ok ? 'ok' : 'bad'); }
      }
    } catch (_) {}
    busy = false;
  }, 220);
}

const DOCS = {
  co: {coll:'corders', label:'客戶訂單', pref:'CO', short:'訂', partner:'customer', price:'price', dateLabel:'交貨日', act:'出貨', doneLbl:'已出', srcType:'sale',   open:'待出貨', part:'部分出貨', tagCls:'out'},
  po: {coll:'porders', label:'採購單',   pref:'PO', short:'採', partner:'supplier', price:'cost',  dateLabel:'預計到貨日', act:'收貨', doneLbl:'已收', srcType:'purchase', open:'待收貨', part:'部分收貨', tagCls:'in'}
};

function docProgress(kind, d){
  const D = DOCS[kind], f = S.d.fill[d.id] || {};
  let rem = 0, done = 0;
  const lines = (d.lines || []).map(l => {
    const got = r3(f[l.pid] || 0), r = Math.max(r3(l.qty - got), 0);
    rem += r; done += Math.min(got, l.qty);
    return {...l, got, rem:r};
  });
  let state, label;
  if (d.status === 'cancelled'){ state = 'cancelled'; label = '已取消'; }
  else if (rem <= 0.0004){ state = 'complete'; label = '已完成'; }
  else if (d.status === 'closed'){ state = 'closed'; label = '已結案'; }
  else if (done > 0.0004){ state = 'partial'; label = D.part; }
  else { state = 'open'; label = D.open; }
  return {lines, rem:r3(rem), done:r3(done), state, label, active:state === 'open' || state === 'partial'};
}
async function createDoc(kind, o){
  const D = DOCS[kind], date = o.date || today();
  const total = mInt(o.lines.reduce((a, l) => a + amtOf(l.qty, l.price), 0));
  const doc = {no:D.pref + date.slice(2).replace(/-/g, '') + '-' + rid(), partnerId:o.partnerId, date, expected:o.expected || addDays(date, 7),
    lines:o.lines, total, note:o.note || '', status:'open', by:S.meId || null, at:Date.now(), ...(o.extra || {})};
  const ref = S.db.collection(D.coll).doc();
  await ref.set(doc);
  return {...doc, id:ref.id};
}
const supplierOf = p => (p.supplierId && S.partners[p.supplierId]) ? p.supplierId : (S.d.lastSup[p.id] || '');

function roundBuy(raw, moq, lot){
  let q = raw;
  if (moq > 0 && q < moq) q = moq;
  if (lot > 0) q = Math.ceil(r3(q / lot) - 0.0004) * lot;
  return r3(q);
}
const buyRule = p => [(Number(p.moq) || 0) > 0 ? '最小量 ' + num(p.moq) : '', (Number(p.lot) || 0) > 0 ? '批量 ' + num(p.lot) : ''].filter(Boolean).join('　');
function suggestions(){
  const out = [];
  for (const p of activeProducts()){
    if (p.procSrc === 'make') continue;
    const onHand = stockOf(p.id), commit = S.d.commit[p.id] || 0, inc = S.d.incoming[p.id] || 0;
    const projected = r3(onHand + inc - commit), safety = p.safety || 0;
    const trigger = safety > 0 ? projected <= safety + 0.0004 : projected < -0.0004;
    if (!trigger) continue;
    const raw = Math.ceil(r3(safety * 2 - projected) - 0.0004);
    if (raw <= 0) continue;
    const moq = Number(p.moq) || 0, lot = Number(p.lot) || 0;
    const need = roundBuy(raw, moq, lot);
    out.push({p, onHand, commit, inc, projected, safety, need, raw, moq, lot, reason:onHand + inc < commit ? '訂單缺貨' : '低於安全庫存', supplier:supplierOf(p)});
  }
  return out.sort((a, b) => cmpSku(a.p, b.p));
}

async function makePOs(groups){

    for (const g of groups){

      made.push(await createDoc('po', {partnerId:g.supId, lines, note:'由採購建議產生', extra:{from:'suggestion'}}));

}

function twCaps(n){
  n = Math.round((Number(n) || 0) * 100) / 100;
  const neg = n < 0; n = Math.abs(n);
  const D = '零壹貳參肆伍陸柒捌玖', U = ['', '拾', '佰', '仟'], B = ['', '萬', '億', '兆'];
  const four = v => { let s = '', z = false; for (let i = 3; i >= 0; i--){ const d = Math.floor(v / Math.pow(10, i)) % 10; if (d){ if (z && s) s += '零'; s += D[d] + U[i]; z = false; } else z = true; } return s; };
  let yuan = Math.floor(n + 1e-9), cents = Math.round((n - yuan) * 100);
  if (cents >= 100){ yuan += 1; cents -= 100; }
  let out = '';
  if (yuan === 0) out = '零';
  else {
    const g = []; let y = yuan; while (y > 0){ g.push(y % 10000); y = Math.floor(y / 10000); }
    let pend = false;
    for (let i = g.length - 1; i >= 0; i--){
      const v = g[i]; if (v === 0){ pend = true; continue; }
      if (out && (pend || v < 1000)) out += '零';
      out += four(v) + B[i]; pend = false;
    }
  }
  let s = out + '元';
  if (cents) { const j = Math.floor(cents / 10), f = cents % 10; s += (j ? D[j] + '角' : '零') + (f ? D[f] + '分' : ''); } else s += '整';
  return (neg ? '負' : '') + s;
}

const layoutTp = id => SLIPFORMS[id || 'north'] || INV_TP;
const slipFormLayout = (id) => { const tp = layoutTp(id); return deepMerge(tp.def, (S[tp.cfg] && S[tp.cfg].layout) || {}); };
function slipFormLocal(id){ const k = layoutTp(id).localKey; try { return {ox:0, oy:0, ...JSON.parse(localStorage.getItem(k) || '{}')}; } catch (_) { return {ox:0, oy:0}; } }
function saveSlipFormLocal(v, id){ try { localStorage.setItem(layoutTp(id).localKey, JSON.stringify(v)); } catch (_) {} }

function fitFs(text, wmm, fs){
  let em = 0; for (const ch of String(text == null ? '' : text)) em += ch.charCodeAt(0) > 255 ? 1 : 0.65;
  const est = em * fs * 0.3528;
  return est > wmm && est > 0 ? Math.max(fs * wmm / est, 6.5) : fs;
}

function slipEnv(L, local, opt, fs, title){
  const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]));
  const n2 = x => (Number(x) || 0).toLocaleString('zh-TW', {maximumFractionDigits:2});
  const T = (x, y, txt, p) => {
    p = p || {}; const f0 = p.fs || fs, rd = v => Math.round(v * 100) / 100;
    let st = 'top:' + rd(y) + 'mm;';
    if (p.r) st += 'left:' + rd(x - p.w) + 'mm;width:' + p.w + 'mm;text-align:right;';
    else st += 'left:' + rd(x) + 'mm;' + (p.w ? 'width:' + p.w + 'mm;overflow:hidden;' : '');
    st += 'font-size:' + (p.w && (!p.r || p.fit) ? fitFs(txt, p.w, f0) : f0) + 'pt;';
    return '<div class="f' + (p.cls ? ' ' + p.cls : '') + '" style="' + st + '">' + e(txt) + '</div>';
  };
  const gridHtml = () => {
    let h = '';
    for (let x = 0; x <= L.w; x += 10) h += '<div class="g" style="left:' + x + 'mm;top:0;height:' + L.h + 'mm;width:0;border-left:.2mm solid #f66"></div>' + (x % 50 === 0 ? '<div class="gl" style="left:' + x + 'mm;top:0">' + x + '</div>' : '');
    for (let y = 0; y <= L.h; y += 10) h += '<div class="g" style="top:' + y + 'mm;left:0;width:' + L.w + 'mm;height:0;border-top:.2mm solid #f66"></div>' + (y % 50 === 0 && y ? '<div class="gl" style="top:' + y + 'mm;left:0">' + y + '</div>' : '');
    return h;
  };
  const ox = opt.noLocal ? 0 : toNum(local.ox), oy = opt.noLocal ? 0 : toNum(local.oy);
  const shell = pages => {
    const css = '@page{size:' + L.w + 'mm ' + L.h + 'mm;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000}' +
      'body{font:700 ' + fs + 'pt/1 "Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif}' +
      '.form{position:relative;width:' + L.w + 'mm;height:' + L.h + 'mm;overflow:hidden;page-break-after:always;break-after:page}.form:last-child{page-break-after:auto;break-after:auto}' +
      '.in{position:absolute;left:' + ox + 'mm;top:' + oy + 'mm;width:100%;height:100%}' +
      '.f{position:absolute;white-space:nowrap;line-height:1;transform:translateY(-50%)}.f.ck{transform:translate(-50%,-50%)}.f.nt{transform:none;white-space:normal;overflow:hidden}' +
      '.g{position:absolute;pointer-events:none}.gl{position:absolute;font:6pt sans-serif;color:#f33}' +
      '@media screen{html,body{background:#dfe3e8}.form{margin:0 0 8px;background:#fff' + (opt.bg ? ' url(' + opt.bg + ') 0 0/100% 100% no-repeat' : '') + '}}' +
      '@media print{.bar{display:none!important}}';
    return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>' + e(title) + '</title><style>' + css + '</style></head><body>' +
      (opt.standalone ? '<div class="bar" style="position:fixed;right:8px;top:8px;z-index:9;font:14px sans-serif"><button onclick="window.print()">列印</button></div>' : '') + pages + '</body></html>';
  };
  return {e, n2, T, gridHtml, shell};
}
function slipRows(o, F, per){
  const c = invCalc(o, {mode:F.mode, taxType:F.taxType, merge:false});
  const rows = c.rows.map(r => ({sku:r.sku || '', name:r.name, qty:r.qty, unit:r.unit, price:r.price, amt:r.amt}));
  const pages = []; for (let i = 0; i < Math.max(rows.length, 1); i += per) pages.push(rows.slice(i, i + per));
  return {c, pages};
}

/* ---------- 北區銷貨單 ---------- */
function slipFormHTML(o, F, L, local, opt){
  opt = opt || {};
  const fs = Math.min(Math.max(toNum(L.fs) || 10, 7), 16), hfs = Math.min(Math.max(toNum(L.hfs) || 9, 7), 14);
  const env = slipEnv(L, local, opt, fs, '銷貨單套印 ' + o.no), {e, n2, T} = env;
  const {c, pages} = slipRows(o, F, Math.max(Math.round(L.item.rows), 1));
  const dt = String(o.date || '').split('-').map(Number);
  const f = L.f, cl = L.col;
  const html = pages.map((pr, pi) => {
    const last = pi === pages.length - 1;
    let h = '';
    if (F.code) h += T(f.code.x, f.code.y, F.code, {w:60, fs:hfs});
    if (dt.length === 3 && dt[0]) h += T(f.year.xr, f.year.y, dt[0] - 1911, {r:1, w:10}) + T(f.month.xr, f.month.y, dt[1], {r:1, w:8}) + T(f.day.xr, f.day.y, dt[2], {r:1, w:8});
    h += T(f.no.x, f.no.y, o.no, {w:36, fs:hfs});
    if (F.name) h += T(f.name.x, f.name.y, F.name, {w:100, fs:hfs});
    if (F.addr) h += T(f.addr.x, f.addr.y, F.addr, {w:100, fs:hfs});
    if (F.ship) h += T(f.ship.x, f.ship.y, F.ship, {w:100, fs:hfs});
    if (F.tel) h += T(f.tel.x, f.tel.y, F.tel, {w:60, fs:hfs});
    if (F.contact) h += T(f.contact.x, f.contact.y, F.contact, {w:36, fs:hfs});
    if (F.tax) h += T(f.tax.x, f.tax.y, F.tax, {w:34, fs:hfs});
    if (F.inv) h += T(f.inv.x, f.inv.y, F.inv, {w:34, fs:hfs});
    if (F.sales) h += T(f.sales.x, f.sales.y, F.sales, {w:34, fs:hfs});
    if (F.wh) h += T(f.wh.x, f.wh.y, F.wh, {w:34, fs:hfs});
    if (F.dm >= 0 && f.dm[F.dm]) h += T(f.dm[F.dm].x, f.dm[F.dm].y, 'V', {cls:'ck', fs:12});
    pr.forEach((r, i) => {
      const y = L.item.y + i * L.item.pitch;
      if (r.sku) h += T(cl.sku.x, y, r.sku, {w:cl.sku.w});
      h += T(cl.name.x, y, r.name, {w:cl.name.w});
      h += T(cl.qty.xr, y, n2(r.qty) + (r.unit || ''), {r:1, w:cl.qty.w});
      h += T(cl.price.xr, y, n2(r.price), {r:1, w:cl.price.w});
      h += T(cl.amt.xr, y, n2(r.amt), {r:1, w:cl.amt.w});

function openPrint(ref){
  const o = typeof ref === 'string' ? S.orders[ref] : ref;
  if (!o) return toast('找不到這張單據');
  ensureNames([o.by]);
  const P = loadPrint(), T = TYPES[o.type] || TYPES.sale, isSale = o.type === 'sale';
  if (!SLIPFORMS[P.form]) P.form = 'north';
  let tp = SLIPFORMS[P.form], F = tp.fromOrder(o), local = slipFormLocal(tp.id);
  const sh = sheet({title:'列印' + T.label});
  const pvBox = h('div', {style:'overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#dfe3e8;margin-top:12px'});
  let fr = null;
  const formOn = () => isSale && P.mode !== 'full';
  const paint = () => {
    savePrint(P);
    const SL = slipFormLayout(tp.id), on = formOn();
    const pw = on ? SL.w : paperSize(P)[0], pxW = pw * 3.7795;
    const cw = (sh.bodyEl.clientWidth || 340) - 34, sc = Math.min(1, cw / pxW);
    fr = h('iframe', {title:'列印預覽', style:'width:' + pxW + 'px;height:400px;border:0;transform:scale(' + sc + ');transform-origin:0 0;display:block;background:#dfe3e8'});
    fr.addEventListener('load', () => {
      try { const hgt = fr.contentDocument.documentElement.scrollHeight; fr.style.height = hgt + 'px'; pvBox.style.height = Math.ceil(hgt * sc) + 'px'; } catch (_) {}
    });
    pvBox.style.height = Math.ceil((on ? SL.h * 3.7795 : 400) * sc) + 'px';
    fr.setAttribute('srcdoc', on ? tp.html(o, F, SL, local, {bg:F.bg ? tp.bg : null}) : slipHTML(o, P, false));
    setKids(pvBox, fr);
  };
  const soon = () => { clearTimeout(soon.t); soon.t = setTimeout(paint, 250); };
  const html = standalone => formOn() ? tp.html(o, F, slipFormLayout(tp.id), local, {standalone}) : slipHTML(o, P, standalone);

  /* ---- 完整列印（自行畫表格）控制項 ---- */
  const inputs = {};
  const paperSel = h('select', {class:'in', 'aria-label':'紙張', onchange:e => {
    P.paper = e.target.value; Object.assign(P, PAPERS[P.paper][3] || {});
    if (P.paper !== 'custom'){ P.w = PAPERS[P.paper][1]; P.h = PAPERS[P.paper][2]; }
    customRow.style.display = P.paper === 'custom' ? 'grid' : 'none';
    Object.keys(inputs).forEach(k => { inputs[k].value = P[k]; }); fsSel.value = String(P.fs); paint(); }},
    ...Object.entries(PAPERS).map(([k, v]) => h('option', {value:k, text:v[0]})));
  paperSel.value = P.paper;
  const fsSel = h('select', {class:'in', 'aria-label':'字級', onchange:e => { P.fs = toNum(e.target.value); paint(); }}, ...[8, 9, 10, 11, 12, 14].map(v => h('option', {value:v, text:v + ' pt'})));
  fsSel.value = String(P.fs);
  const num_ = (key, label) => { const inp = h('input', {class:'in', type:'text', inputmode:'decimal', value:P[key], 'aria-label':label, style:'height:38px', onchange:e => { P[key] = toNum(e.target.value); paint(); }}); inputs[key] = inp;
    return h('div', null, h('label', {style:'display:block;font-size:12px;color:var(--ink3);margin-bottom:4px', text:label}), inp); };
  const customRow = h('div', {style:'display:' + (P.paper === 'custom' ? 'grid' : 'none') + ';grid-template-columns:1fr 1fr;gap:8px;margin-top:10px'}, num_('w', '寬（mm）'), num_('h', '高（mm）'));
  const chk = (key, label) => h('label', {class:'check'}, h('input', {type:'checkbox', checked:!!P[key], onchange:e => { P[key] = e.target.checked; paint(); }}), label);
  const fullCtl = h('div', null,
    h('div', {class:'f2'}, fld('紙張', paperSel), fld('字級', fsSel)),
    customRow,
    chk('price', '顯示單價與金額（取消＝出貨單，不含價格）'), chk('sku', '顯示料號'), chk('bold', '加粗字體（多聯複寫比較清楚）'),
    h('details', {style:'margin:8px 0'}, h('summary', {style:'cursor:pointer;color:var(--ink2)', text:'進階：邊界與位置微調（mm）'}),
      h('div', {style:'display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px'}, num_('mt', '上邊界'), num_('mr', '右邊界'), num_('mb', '下邊界'), num_('ml', '左邊界')),
      h('div', {style:'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px'}, num_('ox', '整體右移'), num_('oy', '整體下移')),
      h('p', {class:'hint', style:'margin-top:6px', text:'報表紙印出來位置偏了，就在這裡微調；設定只存在這台電腦的瀏覽器。'})));

  /* ---- 套印預印表單控制項（依套表版型動態建立）---- */
  const fchips = (list, cur, on) => h('div', {class:'chips', style:'padding-top:0'}, list.map(([k, t]) => h('button', {class:'chip', 'aria-pressed':cur() === k, onclick:e => { on(k); [...e.target.parentElement.children].forEach(b => b.setAttribute('aria-pressed', String(b === e.target))); paint(); }}, t)));
  const formCtl = h('div');
  const adminBtn = h('button', {class:'btn ghost', onclick:() => openSlipFormLayout(tp.id)}, '版面校準');
  const syncVis = () => { fullCtl.style.display = formOn() ? 'none' : ''; formCtl.style.display = formOn() ? '' : 'none'; adminBtn.style.display = formOn() && S.isAdmin ? '' : 'none'; };
  function buildForm(){
    const ftxt = (key, label) => fld(label, h('input', {class:'in', value:F[key] || '', 'aria-label':label, autocomplete:'off', oninput:e => { F[key] = e.target.value; soon(); }}));
    setKids(formCtl,
      h('div', {class:'f'}, h('label', {text:'套表版型'}), fchips(Object.values(SLIPFORMS).map(x => [x.id, x.name]), () => tp.id, k => {
        tp = SLIPFORMS[k]; P.form = k; F = tp.fromOrder(o); local = slipFormLocal(k); buildForm(); syncVis(); })),
      h('p', {class:'note', text:'只印資料，套在你手上的「' + tp.full + '」預印套表上（複寫給後面幾聯）。紙張規格：' + tp.paper + '（' + tp.paperMm + '）。'}),
      tp.fields.map(row => row.length === 1 ? ftxt(row[0][0], row[0][1]) : h('div', {class:'f2'}, row.map(([k, l]) => ftxt(k, l)))),
      tp.id === 'north' ? h('div', {class:'f'}, h('label', {text:'交貨方式'}), fchips([['-1', '不勾'], ['0', '送貨'], ['1', '郵寄'], ['2', '自取'], ['3', '貨運']], () => String(F.dm), k => { F.dm = Number(k); })) : null,
      tp.id === 'south' ? h('label', {class:'check'}, h('input', {type:'checkbox', checked:!!F.brandSku, onchange:e => { F.brandSku = e.target.checked; paint(); }}), '「廠牌」欄印商品料號（取消則留空）') : null,
      h('div', {class:'f'}, h('label', {text:'營業稅'}), fchips([['taxable', '應稅 5%'], ['exempt', '免稅／不列稅']], () => F.taxType, k => { F.taxType = k; }),
        fchips([['excl', '單據金額是未稅價'], ['incl', '單據金額是含稅價']], () => F.mode, k => { F.mode = k; })),
      ftxt('note', '備註'),
      h('label', {class:'check'}, h('input', {type:'checkbox', checked:F.bg !== false, onchange:e => { F.bg = e.target.checked; paint(); }}), '預覽顯示套表底圖（只用於預覽，不會印出）'),
      h('details', {style:'margin:8px 0'}, h('summary', {style:'cursor:pointer;color:var(--ink2)', text:'這台電腦的位置微調（mm）與紙張設定'}),
        h('div', {style:'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px'},
          ...[['ox', '整體右移'], ['oy', '整體下移']].map(([k, t]) => h('div', null, h('label', {style:'display:block;font-size:12px;color:var(--ink3);margin-bottom:4px', text:t}), h('input', {class:'in', type:'text', inputmode:'decimal', value:local[k], 'aria-label':t + '（套表）', style:'height:38px', onchange:e => { local[k] = toNum(e.target.value); saveSlipFormLocal(local, tp.id); paint(); }})))),
        h('ol', {style:'margin:10px 0 0 18px;font-size:14px;color:var(--ink2)'},
          h('li', {text:'Windows「印表機與掃描器」→ 列印伺服器內容 → 建立新格式（例如「' + tp.name + '」），尺寸 ' + tp.paperMm + '；LQ-690C 的列印喜好設定選這個紙張，進紙來源選後方拖曳進紙，導入紙張讓第一行對齊列印頭。'}),
          h('li', {text:'瀏覽器列印視窗：印表機選 EPSON LQ-690C、邊界選「無」、比例 100%，取消頁首頁尾與背景圖形。'}),
          h('li', {text:'第一次先在空白報表紙上試印，再和套表疊在一起對光看，位置有偏就用上面的位移，或請管理員按「版面校準」。'}),
          h('li', {text:'品項超過表單行數時，會自動分成多張，每張印小計，最後一張印營業稅與合計。'}))));
  }
  buildForm();

  const modeRow = isSale ? h('div', {class:'chips', style:'padding-top:0'}, [['form', '套印預印表單'], ['full', '完整列印（含表格）']].map(([k, t]) =>
    h('button', {class:'chip', 'aria-pressed':(P.mode !== 'full' ? 'form' : 'full') === k, onclick:e => {
      P.mode = k; [...e.target.parentElement.children].forEach(b => b.setAttribute('aria-pressed', String(b === e.target))); syncVis(); paint(); }}, t))) : null;

        h('li', {text:'Windows「設定 → 藍牙與裝置 → 印表機與掃描器」，點 EPSON LQ-690C → 設為預設。若沒有這個選項，先關閉「讓 Windows 管理我的預設印表機」。'}),

        h('li', {text:'網頁無法替你指定或切換印表機，是由作業系統的預設印表機和瀏覽器列印視窗決定。'}))),
    h('div', {class:'sec-h', style:'margin-top:8px'}, h('h2', {text:'預覽'})), pvBox);
  sh.footEl.append(
    h('button', {class:'btn ghost', 'aria-label':'下載列印檔', onclick:() => saveFile((formOn() ? '銷貨單套印' : T.label) + '_' + o.no + '.html', html(true))}, icon('down'), '下載'),
    adminBtn,
    h('button', {class:'btn grow', onclick:() => printNow(html(false), (formOn() ? '銷貨單套印' : T.label) + '_' + o.no + '.html', () => html(true))}, '列印'));
  paint();
}

function deepMerge(base, over){
  const out = Array.isArray(base) ? base.slice() : {...base};
  if (over && typeof over === 'object') for (const k of Object.keys(over)){
    if (base && typeof base[k] === 'object' && base[k] !== null && !Array.isArray(base[k])) out[k] = deepMerge(base[k], over[k]);
    else if (over[k] !== undefined && over[k] !== null) out[k] = over[k];
  }
  return out;
}

function parseTwAddr(s){
  const o = {city:'', dist:'', road:'', sec:'', lane:'', alley:'', no:'', floor:'', room:''};
  let t = String(s || '').replace(/[\s　]+/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248)).replace(/^\d{3,6}/, '');
  const take = (re, key) => { const m = t.match(re); if (m){ o[key] = m[1]; t = t.slice(m[0].length); return true; } return false; };
  take(/^(.{1,3}?[縣市])/, 'city');
  take(/^(.{1,3}?[鄉鎮市區])/, 'dist');
  take(/^(.+?(?:大道|路|街|道)[東西南北]?)(?=[一二三四五六七八九十百\d]+段|\d|$|之)/, 'road') || take(/^(.+?(?:大道|路|街|道))/, 'road');
  take(/^([一二三四五六七八九十百\d]+)段/, 'sec');
  take(/^(\d+(?:之\d+)?)巷/, 'lane');
  take(/^(\d+(?:之\d+)?)弄/, 'alley');
  take(/^(\d+(?:[-之]\d+)?)號/, 'no');
  if (take(/^((?:B|地下)?\d+|[一二三四五六七八九十]+)樓/, 'floor')){ const m = t.match(/^之(\d+)/); if (m){ o.room = m[1]; t = t.slice(m[0].length); } }
  else { const m = t.match(/^之(\d+)/); if (m){ o.no = (o.no ? o.no + '之' : '') + m[1]; t = t.slice(m[0].length); } }
  if (!o.room){ const m = t.match(/^(?:之)?([A-Za-z]?\d+[A-Za-z]?)室/); if (m) o.room = m[1]; }
  return o;
}

function validTaxId(s){
  s = String(s || '').trim();
  if (!/^\d{8}$/.test(s)) return false;
  const wt = [1, 2, 1, 2, 1, 2, 4, 1], d = s.split('').map(Number);
  const sum = d.reduce((a, x, i) => { const p = x * wt[i]; return a + Math.floor(p / 10) + (p % 10); }, 0);
  return sum % 5 === 0 || (d[6] === 7 && (sum + 1) % 5 === 0);
}

function invCalc(o, opt){
  const src = (o.lines || []).map(l => ({name:l.name, sku:l.sku || '', qty:Number(l.qty) || 0, unit:l.unit || '', price:Number(l.price) || 0}));
  const orderTotal = Math.round(o.total || 0), taxable = opt.taxType === 'taxable', incl = taxable && opt.mode === 'incl';
  let rows, sales, tax, total;
  if (incl){
    tax = Math.round(orderTotal / 1.05 * 0.05 + 1e-9); sales = orderTotal - tax; total = orderTotal;
    rows = src.map(l => ({...l, price:r2(l.price / 1.05), amt:Math.round(l.qty * l.price / 1.05 + 1e-9)}));
    const diff = sales - rows.reduce((a, r) => a + r.amt, 0);
    if (rows.length && diff) rows[rows.length - 1].amt += diff;
  } else {
    rows = src.map(l => ({...l, amt:Math.round(l.qty * l.price + 1e-9)}));
    sales = rows.reduce((a, r) => a + r.amt, 0);
    tax = taxable ? Math.round(sales * 0.05 + 1e-9) : 0; total = sales + tax;
  }
  if (opt.merge) rows = [{name:opt.mergeName || '貨款', qty:1, unit:'', price:sales, amt:sales}];
  return {rows, sales, tax, total, taxType:opt.taxType};
}

function invoiceHTML(cx, L, local, o){
  o = o || {};
  const fs = Math.min(Math.max(toNum(L.fs) || 10.5, 7), 18), cfs = Math.min(Math.max(toNum(L.capFs) || 11, 7), 20);
  const env = slipEnv(L, local, {}, fs, '發票套印'), {e, n2, T} = env;
  const ox = o.noLocal ? 0 : toNum(local.ox), oy = o.noLocal ? 0 : toNum(local.oy);
  const D = '零壹貳參肆伍陸柒捌玖';
  const f = L.f, c = L.col;
  let h = '';
  const b = cx.buyer || {};
  if (b.name) h += T(f.name.x, f.name.y, b.name, {w:95});
  const tid = String(b.tax || '').replace(/\D/g, '');
  for (let i = 0; i < tid.length && i < L.taxCount; i++) h += T(f.tax.x + i * L.taxPitch, f.tax.y, tid[i], {w:L.taxPitch, cls:'c'});
  const dt = String(cx.date || '').split('-').map(Number);
  if (dt.length === 3 && dt[0]){
    if (L.showYear) h += T(f.year.xr, f.year.y, dt[0] - 1911, {r:1, w:10});
    h += T(f.month.xr, f.month.y, dt[1], {r:1, w:8}) + T(f.day.xr, f.day.y, dt[2], {r:1, w:8});
  }
  const ap = cx.ap || {};
  for (const [k] of ADDR_KEYS) if (ap[k] && L.addr[k]) h += T(L.addr[k].xr, L.addr.y, ap[k], {r:1, w:L.addr[k].w, fit:1});
  (cx.rows || []).slice(0, L.rows).forEach((r, i) => {
    const y = L.item.y + i * L.pitch;
    h += T(c.name.x, y, r.name, {w:c.name.w});
    h += T(c.qty.xr, y, n2(r.qty) + (r.unit || ''), {r:1, w:c.qty.w, fit:1});
    h += T(c.price.xr, y, n2(r.price), {r:1, w:c.price.w, fit:1});
    h += T(c.amt.xr, y, n2(r.amt), {r:1, w:c.amt.w, fit:1});
  });
  h += T(f.sales.xr, f.sales.y, n2(cx.sales), {r:1, w:c.amt.w}) + T(f.taxAmt.xr, f.taxAmt.y, n2(cx.tax), {r:1, w:c.amt.w}) + T(f.total.xr, f.total.y, n2(cx.total), {r:1, w:c.amt.w});
  const mk = {taxable:'chkT', zero:'chkZ', exempt:'chkE'}[cx.taxType];
  if (mk) h += T(f[mk].x, f[mk].y, 'V', {cls:'ck', fs:12});
  const ts = String(Math.round(cx.total || 0));
  for (let i = 0; i < L.capCount; i++){
    const place = L.capCount - 1 - i;
    if (place >= ts.length) continue;
    h += T(f.cap.x + i * L.capPitch, f.cap.y, D[+ts[ts.length - 1 - place]], {w:L.capPitch, cls:'c', fs:cfs});
  }
  if (cx.note) h += '<div class="f nt" style="left:' + f.note.x + 'mm;top:' + Math.round((f.note.y - L.notePitch / 2) * 100) / 100 + 'mm;width:' + L.noteW + 'mm;height:' + (L.noteLines * L.notePitch) + 'mm;line-height:' + L.notePitch + 'mm;font-size:' + Math.max(fs - 1, 7) + 'pt">' + e(cx.note) + '</div>';
  if (o.grid) h += env.gridHtml();
  const css = '@page{size:' + L.w + 'mm ' + L.h + 'mm;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000;height:' + L.h + 'mm;overflow:hidden}' +
    'body{font:700 ' + fs + 'pt/1 "Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif}' +
    '.form{position:relative;width:' + L.w + 'mm;height:' + L.h + 'mm;left:' + ox + 'mm;top:' + oy + 'mm}' +
    '.f{position:absolute;white-space:nowrap;line-height:1;transform:translateY(-50%)}.f.c{text-align:center}.f.ck{transform:translate(-50%,-50%)}.f.nt{transform:none;white-space:normal;overflow:hidden}' +
    '.g{position:absolute;pointer-events:none}.gl{position:absolute;font:6pt sans-serif;color:#f33}' +
    '@media screen{html,body{background:#dfe3e8}.form{background:#fff' + (o.bg ? ' url(' + o.bg + ') 0 0/100% 100% no-repeat' : '') + ';outline:1px dashed #888}}' +
    '@media print{.bar{display:none!important}}';
  return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>發票套印</title><style>' + css + '</style></head><body>' +
    (o.standalone ? '<div class="bar" style="position:fixed;right:8px;top:8px;z-index:9;font:14px sans-serif"><button onclick="window.print()">列印</button></div>' : '') +
    '<div class="form">' + h + '</div></body></html>';
}

function withAutoPrint(html){
  const sc = '<script>addEventListener("load",function(){setTimeout(function(){print()},400)})<\/script>';
  return /<\/body>/i.test(html) ? html.replace(/<\/body>/i, sc + '</body>') : html + sc;
}
/* 直接啟動作業系統的列印視窗：①隱藏頁面內列印 → ②被擋就開新視窗列印 → ③再不行才改成下載（開啟後自動列印） */
function printNow(html, fname, standaloneFn){
  let opened = false, settled = false;
  const fr = document.createElement('iframe');
  fr.setAttribute('title', '列印'); fr.setAttribute('aria-hidden', 'true');
  fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;height:700px;border:0;opacity:0;pointer-events:none';
  let attempted = false;
  const done = () => { settled = true; setTimeout(() => fr.remove(), 60000); };
  const viaWindow = () => {
    let win = null; try { win = window.open('', '_blank'); } catch (_) {}
    if (win){ try { win.document.open(); win.document.write(withAutoPrint(html)); win.document.close(); return; } catch (_) {} }
    if (!standaloneFn) return toast('這個環境不允許直接開啟列印視窗');
    Promise.resolve(saveFile(fname, withAutoPrint(standaloneFn()))).then(ok => { if (ok) toast('這個環境擋掉了直接列印，已下載列印檔：用瀏覽器開啟就會自動跳出列印視窗（原因可到「更多 → 列印診斷」查看）'); });
  };
  const guard = setTimeout(() => { if (!settled && !attempted){ done(); viaWindow(); } }, 2500);
  fr.addEventListener('load', () => {
    if (settled || attempted) return; attempted = true; clearTimeout(guard);
    const cw = fr.contentWindow;
    try {
      cw.addEventListener('beforeprint', () => { opened = true; });
      cw.addEventListener('afterprint', () => { opened = true; });
      if (cw.matchMedia) cw.matchMedia('print').addListener(mq => { if (mq.matches) opened = true; });
      cw.focus(); cw.print();
    } catch (_) {}
    setTimeout(() => { if (opened){ done(); return; } done(); viaWindow(); }, 900);
  });
  fr.setAttribute('srcdoc', html);
  document.body.append(fr);
}

const VEH_TYPE = {car:'汽車', truck:'貨車', motor:'機車', other:'其他'};
const VEH_FUEL = {'95':'95 無鉛', '98':'98 無鉛', diesel:'柴油', ev:'電動'};
const MAINT_PRESET = ['引擎機油＋濾芯', '輪胎更換', '煞車來令片', '電瓶更換', '定期保養', '驗車', '保險', '其他'];
const vehActive = () => Object.values(S.vehicles).filter(v => v.active !== false).sort((a, b) => (a.plate || '').localeCompare(b.plate || '', 'zh-TW'));
const vehOdo = id => S.d.vehOdo[id] || 0;
function vehFuelLogs(id){ return Object.values(S.fuellogs).filter(f => f.vehicleId === id).sort((a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0)); }
function vehMaint(id){ return Object.values(S.maint).filter(m => m.vehicleId === id).sort((a, b) => b.date.localeCompare(a.date)); }
function vehStats(id){
  const fuel = vehFuelLogs(id).filter(f => f.type !== 'topup' && f.odo);
  let totKm = 0, totL = 0, totFuelCost = 0, totTopup = 0, n = 0;
  const legs = [];
  for (let i = 1; i < fuel.length; i++){
    const km = Number(fuel[i].odo) - Number(fuel[i - 1].odo);
    if (km > 0 && fuel[i].liters > 0){ const kml = km / fuel[i].liters; legs.push({date:fuel[i].date, km, liters:fuel[i].liters, kml}); totKm += km; totL += fuel[i].liters; n++; }
  }
  for (const f of vehFuelLogs(id)){ if (f.type === 'topup') totTopup += f.amount || 0; else if (f.type !== 'adjust') totFuelCost += f.amount || 0; }
  return {avgKml:totL > 0 ? totKm / totL : null, totKm, totL, totFuelCost, totTopup, legs:legs.slice(-8).reverse(), n};
}
function maintDue(m){
  if (!m.nextDate && !m.nextOdo) return null;
  const dDays = m.nextDate ? daysBetween(today(), m.nextDate) : null;
  const dKm = m.nextOdo ? m.nextOdo - vehOdo(m.vehicleId) : null;
  const soonD = dDays !== null && dDays <= 14, soonK = dKm !== null && dKm <= 500;
  const overD = dDays !== null && dDays < 0, overK = dKm !== null && dKm < 0;
  if (!soonD && !soonK) return null;
  return {overdue:overD || overK, dDays, dKm, text:(overD || overK ? '已逾期' : '即將到期') + (m.nextDate ? '　' + m.nextDate + (dDays !== null ? '（' + (dDays < 0 ? '逾 ' + (-dDays) : dDays) + ' 天）' : '') : '') + (m.nextOdo ? '　' + num(m.nextOdo) + ' km' + (dKm !== null ? '（' + (dKm < 0 ? '已超 ' + num(-dKm) : '還有 ' + num(dKm)) + ' km）' : '') : '')};
}
function vehDueList(){ const out = []; for (const v of vehActive()) for (const m of vehMaint(v.id)){ const d = maintDue(m); if (d && !out.some(x => x.v.id === v.id && x.m.item === m.item)) out.push({v, m, d}); } return out.sort((a, b) => (b.d.overdue - a.d.overdue) || (a.d.dDays || 999) - (b.d.dDays || 999)); }

function openFuelImport(){
  const sh = sheet({title:'匯入加油紀錄'});
  const info = h('div'), goBtn = h('button', {class:'btn grow', disabled:true}, '開始匯入');
  let plan = null;
  const file = h('input', {type:'file', accept:'.csv,text/csv', class:'in', style:'padding-top:9px', 'aria-label':'選擇 CSV 檔',
    onchange:e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const rows = parseCSV(rd.result);
        if (rows.length < 2){ setKids(info, h('div', {class:'note bad', text:'檔案沒有資料列'})); return; }
        const head = rows[0].map(x => String(x).trim().toLowerCase()), idx = k => head.indexOf(k);
        const iPlate = idx('車牌'), iDate = idx('日期'), iType = idx('類型'), iWho = idx('駕駛'), iOdo = idx('里程'), iL = idx('公升'), iAmt = idx('金額'), iSt = idx('加油站');
        if (iPlate < 0 || iDate < 0 || iAmt < 0){ setKids(info, h('div', {class:'note bad', text:'找不到必要欄位「車牌」「日期」「金額」'})); return; }
        const items = [], skipped = [], plates = new Set();
        rows.slice(1).forEach((r, n) => {
          const g = i => i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '';
          const plate = g(iPlate).toUpperCase(), date = g(iDate), amt = toNum(g(iAmt));
          if (!plate || !date || !(amt > 0)){ skipped.push('第 ' + (n + 2) + ' 列：缺少車牌、日期或金額'); return; }
          plates.add(plate);
          items.push({plate, date, type:g(iType) === '儲值' ? 'topup' : 'fuel', who:g(iWho), odo:g(iOdo) ? Math.round(toNum(g(iOdo))) : null, liters:g(iL) ? toNum(g(iL)) : null, amount:mInt(amt), station:g(iSt)});
        });
        plan = {items, skipped, plates};
        setKids(info, h('div', {class:'note', text:'可匯入 ' + items.length + ' 筆，略過 ' + skipped.length + ' 列，涉及 ' + plates.size + ' 輛車（不存在的車牌會自動新增）。'}),
          skipped.length ? h('ul', null, skipped.slice(0, 8).map(t => h('li', null, h('small', {text:t})))) : null);
        goBtn.disabled = !items.length;
      };
      rd.readAsText(f, 'utf-8');
    }});
  goBtn.addEventListener('click', async () => {
    if (!plan || !plan.items.length) return;
    goBtn.disabled = true;
    const ok = await run(async () => {
      const byPlate = {};
      for (const v of Object.values(S.vehicles)) byPlate[String(v.plate).toUpperCase()] = v.id;
      for (const p of plan.plates) if (!byPlate[p]){ const ref = S.db.collection('vehicles').doc(); await ref.set({plate:p, name:'', type:'car', fuelType:'95', driver:'', active:true, createdBy:S.meId || null, createdAt:Date.now()}); byPlate[p] = ref.id; }
      let done = 0;
      for (let i = 0; i < plan.items.length; i += 8){
        const chunk = plan.items.slice(i, i + 8);
        const write = () => Promise.all(chunk.map(it => createFuelLog({vehicleId:byPlate[it.plate], date:it.date, type:it.type, who:it.who, odo:it.odo, liters:it.liters, amount:it.amount, station:it.station})));
        try { await write(); } catch (e) { if (e && e.code === 'resource_exhausted'){ await new Promise(r => setTimeout(r, 1200)); await write(); } else throw e; }
        done += chunk.length; goBtn.textContent = '匯入中 ' + done + ' / ' + plan.items.length;
      }
      return true;
    });
    goBtn.textContent = '開始匯入';
    if (ok){ toast('已匯入 ' + plan.items.length + ' 筆'); sh.forceClose(); } else goBtn.disabled = false;
  });
  put(sh.bodyEl,
    h('p', {class:'note', text:'CSV 欄位：車牌、日期（YYYY-MM-DD）、類型（加油或儲值，留空視為加油）、駕駛、里程、公升、金額、加油站。車牌不存在會自動新增車輛。'}),
    h('div', {class:'btns', style:'margin-bottom:14px'}, h('button', {class:'btn ghost sm', onclick:() => saveFile('加油紀錄匯入範本.csv', csvText([
      ['車牌', '日期', '類型', '駕駛', '里程', '公升', '金額', '加油站'], ['BQZ-3207', '2026-09-01', '加油', '王俊傑', 97235, 34.67, 950, ''], ['BQZ-3207', '2026-09-15', '儲值', '王俊傑', '', '', 3120, '']]))}, icon('down'), '下載範本')),
    fld('選擇 CSV 檔', file), info);
  sh.footEl.append(goBtn);
}

function splitAlloc(list, amounts){
  const rest = list.map(a => ({...a})), out = [];
  for (const amt of amounts){
    let left = amt; const part = [];
    for (const r of rest){
      if (left <= 0.004) break;
      const take = Math.min(left, r.amount);
      if (take > 0.004){ part.push({orderId:r.orderId, orderNo:r.orderNo, amount:r2(take)}); r.amount = r2(r.amount - take); left = r2(left - take); }
    }
    out.push(part);
  }
  return out;
}

/* ---- 成本：依實際進貨成本 ---- */
const COST_M = {manual:'手動維護', last:'最近一次進貨價', avg:'移動平均進貨價'};
const costMethodOf = p => p.costMode || S.set.costMethod || 'manual';
const unitFreight = p => S.set.costFreight ? r2((Number(p.volume) || 0) * (Number(S.set.freightRate) || 0)) : 0;
const exPriceOf = (o, l) => (o.taxMode === 'incl' && o.taxType === 'taxable') ? (Number(l.price) || 0) / (1 + taxRate() / 100) : (Number(l.price) || 0);
function costMap(){
  const m = {};
  for (const o of Object.values(S.orders)){
    if (o.type !== 'purchase' || o.status === 'void') continue;
    for (const l of o.lines || []){ const q = Number(l.qty) || 0; if (!(q > 0)) continue; const pr = exPriceOf(o, l), b = m[l.pid] || (m[l.pid] = {sq:0, sa:0, lastK:'', last:null}); b.sq += q; b.sa += q * pr; const k = o.date + String(o.at || 0).padStart(15, '0'); if (k > b.lastK){ b.lastK = k; b.last = pr; } }
  }
  return m;
}
function costTarget(p, cm){ const b = cm[p.id], m = costMethodOf(p); if (!b || m === 'manual') return null; const base = m === 'last' ? b.last : (b.sq > 0 ? b.sa / b.sq : null); return base == null ? null : r2(base + unitFreight(p)); }
async function autoCost(o, stockBefore){
  const agg = {};
  for (const l of o.lines || []){ const q = Number(l.qty) || 0; if (q > 0){ const a = agg[l.pid] || (agg[l.pid] = {q:0, amt:0}); a.q += q; a.amt += q * exPriceOf(o, l); } }
  for (const [pid, a] of Object.entries(agg)){
    const p = S.products[pid]; if (!p) continue;
    const m = costMethodOf(p); if (m === 'manual') continue;
    const unit = a.amt / a.q + unitFreight(p); let nc;
    if (m === 'last') nc = unit; else { const sb = Math.max(stockBefore[pid] || 0, 0), oc = Number(p.cost) || 0; nc = (sb * oc + a.q * unit) / (sb + a.q); }
    nc = r2(nc); if (nc >= 0 && Math.abs(nc - (Number(p.cost) || 0)) > 0.004) await S.db.doc('products/' + pid).update({cost:nc});
  }
}

function planPartnerImport(text, type, mode){

  const head = rows[0].map(piNorm), col = {};
  for (const [key, , aliases] of PI_FIELDS){ const i = head.findIndex(h0 => aliases.some(a => piNorm(a) === h0)); if (i >= 0) col[key] = i; }
  if (col.name === undefined) return {error:'找不到必要欄位「客戶名稱」。請確認第一列是欄位名稱，可先下載範本。'};

  const byCode = new Map(existing.filter(p => p.code).map(p => [String(p.code).trim().toUpperCase(), p])), byName = new Map(existing.map(p => [String(p.name).trim(), p]));

    const tid = g('taxId').replace(/\D/g, ''); if (g('taxId')){ data.taxId = tid; if (!validTaxId(tid)) warn.push('統一編號「' + g('taxId') + '」檢查碼不符'); }

    if (g('termDays')){ const td = Math.round(toNum(g('termDays'))); if (td >= 0) data.termDays = td; }
    const tx = piTax(g('taxOpt')); if (tx === null) warn.push('稅別「' + g('taxOpt') + '」看不懂，已略過'); else if (tx){ const [a, b] = tx.split(':'); data.taxType = a; data.taxMode = b; }

/* ---- 帳期（結帳日）---- */
const cutoff = () => { const v = S.set.cutoffDay; if (v === undefined || v === null || v === '') return 25; const n = Math.round(Number(v)); return isFinite(n) ? Math.min(Math.max(n, 0), 28) : 25; };
const cutoffOf = pt => { const v = pt && pt.billDay; return v !== undefined && v !== null && v !== '' ? Math.min(Math.max(Math.round(Number(v)), 0), 28) : cutoff(); };
function billMonth(ds, day){
  const [y, m, d] = String(ds).split('-').map(Number), c = day === undefined ? cutoff() : day;
  if (c >= 2 && d >= c){ const dt = new Date(y, m, 1); return dt.getFullYear() + '-' + pad(dt.getMonth() + 1); }
  return y + '-' + pad(m);
}
function cycleRange(bm, day){
  const [y, m] = bm.split('-').map(Number), c = day === undefined ? cutoff() : day;
  if (c < 2) return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
  return [ymd(new Date(y, m - 2, c)), ymd(new Date(y, m - 1, c - 1))];
}

function termText(pt){

/* ---- 價格策略 ---- */
const PR_KIND = {percent:'折數（%）', off:'折讓金額', fixed:'固定單價', markup:'成本加成（%）'};
const priceRules = () => Object.values(S.prules).filter(r => r.enabled !== false).sort((a, b) => (Number(a.prio) || 0) - (Number(b.prio) || 0) || String(a.name).localeCompare(String(b.name), 'zh-TW'));
function ruleMatch(r, side, partner, p, qty, date){
  if ((r.side || 'sale') !== side) return false;
  const c = r.cust || {type:'all'};
  if (c.type === 'level' && (!partner || (partner.level || '') !== c.level)) return false;
  if (c.type === 'partner' && (!partner || partner.id !== c.partnerId)) return false;
  const pr = r.prod || {type:'all'};
  if (pr.type === 'category' && p.category !== pr.category) return false;
  if (pr.type === 'product' && p.id !== pr.productId) return false;
  if (qty < (Number(r.minQty) || 0)) return false;
  if (r.from && date < r.from) return false;
  if (r.to && date > r.to) return false;
  return true;
}
function ruleApply(r, base, p){
  const v = Number(r.value) || 0;
  if (r.kind === 'percent') return base * v / 100;
  if (r.kind === 'off') return base - v;
  if (r.kind === 'fixed') return v;

}

  if (!cands.length) return {price:base, rule:null, base};
  const best = (S.set.priceMode === 'lowest') ? cands.reduce((x, y) => y.price < x.price ? y : x) : cands[0];
  return {price:best.price, rule:best.r, base};
}

  return ({percent:(v % 10 === 0 ? (v / 10) : v + '%') + (v % 10 === 0 ? ' 折' : ''), off:'−' + money(v), fixed:money(v), markup:'成本 +' + v + '%'})[r.kind] || '';

}

/* ---- 備份與還原 ---- */
const BK_COLS = ['products', 'partners', 'orders', 'payments', 'notes', 'counts', 'countlines', 'corders', 'porders', 'prules', 'vehicles', 'fuellogs', 'maint', 'cashbook', 'quotes', 'closings', 'collects', 'fuelcards'];
const BK_SET = () => ({main:S.setRaw || {}, invoice:S.invCfg || {}, slipform:S.slipCfg || {}, slipform_south:S.slipCfgS || {}, roles:S.roles || {}});
const bkEvery = () => { const v = S.bk && S.bk.every; return v === undefined || v === null ? 7 : Number(v); };
function bkDue(){
  const ev = bkEvery(); if (!(ev > 0)) return false;
  if (docCount() <= 3) return false;
  const last = (S.bk && S.bk.last) || 0;
  return Date.now() - last > ev * 864e5;
}
function buildBackup(){
  const data = {}, counts = {};
  for (const c of BK_COLS){ data[c] = {}; for (const [id, d] of Object.entries(S[c] || {})){ const {id:_x, ...rest} = d; data[c][id] = rest; } counts[c] = Object.keys(data[c]).length; }
  const settings = {}; for (const [k, v] of Object.entries(BK_SET())) if (v && Object.keys(v).length) settings[k] = v;
  return {app:'inventory', v:1, at:Date.now(), by:S.meId || null, name:S.set.name || '', counts, data:{...data, settings}};
}
async function doBackup(){
  const b = buildBackup(), d = new Date(b.at);
  const fn = '進銷存備份_' + ymd(d) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  const ok = await saveFile(fn, JSON.stringify(b), true);
  if (ok){
    await run(async () => { await S.db.doc('settings/backup').set({...(S.bk || {}), last:b.at, lastBy:S.meId || null, lastFile:fn, every:bkEvery()}); return true; });
  }
  return ok;
}
async function restoreBackup(b, mode, setProgress){
  const ops = [];
  for (const c of BK_COLS) for (const [id, doc] of Object.entries((b.data && b.data[c]) || {})){
    if (mode === 'missing' && S[c][id]) continue;
    ops.push({path:c + '/' + id, doc});
  }
  if (mode !== 'missing') for (const [k, v] of Object.entries((b.data && b.data.settings) || {})) ops.push({path:'settings/' + k, doc:v});
  let done = 0, fail = 0;
  for (let i = 0; i < ops.length; i += 5){
    const chunk = ops.slice(i, i + 5);
    const write = () => Promise.all(chunk.map(o => S.db.doc(o.path).set(o.doc)));
    try { await write(); } catch (e) {
      if (e && e.code === 'resource_exhausted'){ await new Promise(r => setTimeout(r, 1200)); try { await write(); } catch (e2) { fail += chunk.length; } }
