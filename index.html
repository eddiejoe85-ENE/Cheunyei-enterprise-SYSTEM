  const cols = [XC(isAR ? '客戶' : '供應商', 'text', 24), XC(isAR ? '應收金額' : '應付金額', 'money', 14), ...AGE_LABELS.map(l => XC(l, 'money', 14)), XC('逾期合計', 'money', 14)];
  const rows = list.map(p => { const r = ag.byP[p.id] || {b:[0, 0, 0, 0, 0]}; return [p.name, S.d.bal[p.id] || 0, ...r.b, lateOf(r.b)]; });
  return {title:isAR ? '應收帳款' : '應付帳款', sub:'截至 ' + today() + '　共 ' + list.length + ' 戶', filename:isAR ? '應收帳款' : '應付帳款', sections:[{name:isAR ? '應收帳款' : '應付帳款', cols, rows, foot:['合計', ...cols.slice(1).map((_, i) => sumBy(rows, i + 1))]}]};
}
function dsNotes(){
  const q = S.ui.noteQ.trim().toLowerCase(), sf = S.ui.noteSt, df = S.ui.noteDir;
  const list = Object.values(S.notes).filter(n => {
    if (df && n.dir !== df) return false;
    if (sf === 'open' && !NOTE_OPEN.has(n.status)) return false;
    if ((sf === 'cashed' || sf === 'bounced') && n.status !== sf) return false;
    if (!noteInRange(n)) return false;
    if (!q) return true;
    const pt = S.partners[n.partnerId];
    return (n.no + ' ' + (n.bank || '') + ' ' + (pt ? pt.name : '')).toLowerCase().includes(q);
  }).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const cols = [XC('收／開', 'text', 8), XC('票別', 'text', 8), XC('票號', 'text', 16), XC('銀行', 'text', 16), XC('支票帳號', 'text', 18), XC('對象', 'text', 22), XC('票面金額', 'money', 13), XC('開票日', 'text', 12), XC('到期日', 'text', 12), XC('託收日', 'text', 12), XC('兌現日', 'text', 12), XC('狀態', 'text', 12), XC('備註', 'text', 22)];
  const rows = list.map(n => [n.dir === 'in' ? '收票' : '開票', NOTE_KIND[n.kind] || '', n.no, n.bank || '', n.acct || '', (S.partners[n.partnerId] || {}).name || '', n.amount, n.issueDate, n.dueDate, n.depositDate || '', n.cashDate || '', stLabel(n), n.note || '']);
  return {title:'票據清單', sub:'共 ' + list.length + ' 張　' + today(), filename:'票據清單', sections:[{name:'票據', cols, rows, foot:['合計', '', '', '', '', '', sumBy(rows, 6), '', '', '', '', '', '']}]};
}
function dsDocs(kind){
  const D = DOCS[kind], q = S.ui[kind + 'Q'].trim().toLowerCase(), sf = S.ui[kind + 'St'];
  const all = Object.values(S[D.coll]).map(d => ({d, pr:docProgress(kind, d)})).filter(({d, pr}) => {
    if (sf === 'open' && !pr.active) return false;
    if (sf === 'done' && pr.state !== 'complete' && pr.state !== 'closed') return false;
    if (sf === 'cancelled' && pr.state !== 'cancelled') return false;
    if (!q) return true;
    const pt = S.partners[d.partnerId];
    return (d.no + ' ' + (pt ? pt.name : '') + ' ' + (d.lines || []).map(l => l.name + ' ' + l.sku).join(' ')).toLowerCase().includes(q);
  }).sort((a, b) => (a.d.expected || '').localeCompare(b.d.expected || ''));
  const cols = [XC('單號', 'text', 20), XC('日期', 'text', 12), XC(D.dateLabel, 'text', 14), XC(PLABEL[D.partner], 'text', 22), XC('倉庫', 'text', 12), XC('金額（未稅）', 'money', 14), XC('進度', 'text', 12), XC('未' + D.act.slice(0, 1) + '金額', 'money', 14)];
  const rows = all.map(({d, pr}) => [d.no, d.date, d.expected || '', (S.partners[d.partnerId] || {}).name || '', d.wh ? whName(d.wh) : '', d.total || 0, pr.label, mInt(pr.lines.reduce((a, l) => a + l.rem * l.price, 0))]);
  const det = [];
  for (const {d, pr} of all) for (const l of pr.lines) det.push([d.no, (S.partners[d.partnerId] || {}).name || '', l.sku, l.name, l.qty, l.got, l.rem, l.price, amtOf(l.qty, l.price)]);
  return {title:D.label + '查詢', sub:'共 ' + all.length + ' 張　' + today(), filename:D.label, sections:[{name:D.label, cols, rows, foot:['合計', '', '', '', '', sumBy(rows, 5), '', sumBy(rows, 7)]},
    {name:'品項明細', opt:true, cols:[XC('單號', 'text', 20), XC(PLABEL[D.partner], 'text', 20), XC('料號', 'text', 12), XC('品名', 'text', 26), XC('訂購', 'qty', 10), XC(D.doneLbl, 'qty', 10), XC('未' + D.act.slice(0, 1), 'qty', 10), XC('單價', 'money', 10), XC('金額', 'money', 12)], rows:det}]};
}
function dsReport(){
  const [from, to] = rangeOf(S.ui.rep), s = summarize(from, to), costOk = see('cost');
  const top = Object.values(s.items).filter(i => i.amt > 0).sort((a, b) => b.amt - a.amt);
  const label = ({today:'今日', month:'本月', last:'上月', cycle:'本帳期', lastcycle:'上帳期', year:'今年', all:'全部'})[S.ui.rep] || S.ui.rep;
  const sumRows = [['銷貨淨額（未稅）', s.sale], ['進貨淨額（未稅）', s.purchase], ['收款折讓', s.disc], ...(costOk ? [['估算毛利', s.profit], ['毛利率（%）', s.sale > 0 ? Math.round(s.profit / s.sale * 1000) / 10 : 0]] : []), ['進銷單據數', s.count]];
  const debts = Object.entries(S.d.bal).filter(([id, b]) => S.partners[id] && Math.abs(b) > 0.004).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  return {title:'營運報表', sub:label + '（' + (S.ui.rep === 'all' ? '全部期間' : from + ' ~ ' + to) + '）　' + today(), filename:'營運報表_' + label,
    sections:[{name:'摘要', cols:[XC('項目', 'text', 22), XC('數值', 'money', 16)], rows:sumRows},
      {name:'商品銷售排行', cols:[XC('名次', 'int', 8), XC('商品', 'text', 30), XC('售出數量', 'qty', 12), XC('銷售額（未稅）', 'money', 14)], rows:top.map((i, k) => [k + 1, i.name, i.qty, mInt(i.amt)])},
      {name:'未結帳款', cols:[XC('對象', 'text', 24), XC('類別', 'text', 8), XC('金額', 'money', 14)], rows:debts.map(([id, b]) => [S.partners[id].name, S.partners[id].type === 'customer' ? '應收' : '應付', b])}]};
}
function dsStatement(pid){
  const pt = S.partners[pid]; if (!pt) return null;
  const ent = [];
  for (const o of Object.values(S.orders)){
    if (o.partnerId !== pid || o.status === 'void') continue;
    const T = TYPES[o.type]; if (!T || !T.money) continue;
    const a = r2(T.money * ((o.total || 0) - (o.paid || 0)));
    if (a) ent.push({date:o.date, at:o.at || 0, no:o.no, memo:T.label, amt:a, bm:billMonth(o.date, cutoffOf(pt))});
  }
  for (const pm of Object.values(S.payments)){
    if (pm.partnerId !== pid || pm.status === 'void') continue;
    const eff = ((pt.type === 'customer' && pm.dir === 'in') || (pt.type === 'supplier' && pm.dir === 'out')) ? -1 : 1;
    if (pm.amount) ent.push({date:pm.date, at:pm.at || 0, no:pm.no, memo:PAY[pm.dir].label + '（' + (METHODS[pm.method] || '') + '）', amt:r2(eff * pm.amount), bm:''});
    if ((pm.discount || 0) + (pm.extra || 0) > 0) ent.push({date:pm.date, at:(pm.at || 0) + 1, no:pm.no, memo:'收款折讓' + (pm.pct ? ' ' + pm.pct + '%' : ''), amt:r2(eff * ((pm.discount || 0) + (pm.extra || 0))), bm:''});
  }
  ent.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
  let run_ = 0; const rows = ent.map(e => { run_ = r2(run_ + e.amt); return [e.date, e.no, e.memo, e.bm, e.amt > 0 ? e.amt : null, e.amt < 0 ? -e.amt : null, run_]; });
  return {title:'對帳單－' + pt.name, sub:PLABEL[pt.type] + '　' + termText(pt) + '　餘額 ' + money(S.d.bal[pid] || 0) + '　' + today(), filename:'對帳單_' + pt.name,
    sections:[{name:'對帳單', cols:[XC('日期', 'text', 12), XC('單號', 'text', 20), XC('摘要', 'text', 20), XC('帳期', 'text', 10), XC('增加', 'money', 12), XC('減少', 'money', 12), XC('餘額', 'money', 12)], rows}]};
}

const COLS = {sku:['料號', 'sku', '編號'], barcode:['條碼', 'barcode', 'ean', 'upc'], name:['品名', 'name', '名稱', '商品名稱'], category:['分類', 'category'], unit:['單位', 'unit'],
  cost:['進價', '成本', 'cost'], price:['售價', 'price'], safety:['安全庫存', 'safety'], opening:['期初庫存', '庫存', 'opening', 'stock']};
function parseCSV(t){
  t = String(t).replace(/^\ufeff/, '');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function planImport(text){
  const rows = parseCSV(text);
  if (rows.length < 2) return {error:'檔案沒有資料列'};
  const head = rows[0].map(x => String(x).trim().toLowerCase()), idx = {};
  for (const k in COLS) idx[k] = head.findIndex(x => COLS[k].includes(x));
  if ((idx.sku < 0 && idx.barcode < 0) || idx.name < 0) return {error:'找不到必要欄位「料號」與「品名」'};
  const seen = new Set(Object.values(S.products).map(p => String(p.sku).toLowerCase()));
  const items = [], skipped = [];
  rows.slice(1).forEach((r, n) => {
    const g = k => idx[k] >= 0 ? String(r[idx[k]] == null ? '' : r[idx[k]]).trim() : '';
    const bc = g('barcode'), sku = g('sku') || bc, name = g('name');
    if (!sku || !name){ skipped.push('第 ' + (n + 2) + ' 列：缺少料號或品名'); return; }
    if (seen.has(sku.toLowerCase())){ skipped.push('第 ' + (n + 2) + ' 列：料號 ' + sku + ' 重複'); return; }
    seen.add(sku.toLowerCase());
    items.push({sku, barcode:bc && bc !== sku ? bc : '', name, category:g('category'), unit:g('unit') || '個', cost:Math.max(toNum(g('cost')), 0), price:Math.max(toNum(g('price')), 0), safety:Math.max(toNum(g('safety')), 0), opening:Math.max(toNum(g('opening')), 0)});
  });
  return {items, skipped};
}
function openImport(){
  const sh = sheet({title:'匯入商品'});
  const info = h('div'), goBtn = h('button', {class:'btn grow', disabled:true}, '開始匯入');
  let plan = null;
  const file = h('input', {type:'file', accept:'.csv,text/csv', 'aria-label':'選擇 CSV 檔', class:'in', style:'padding-top:9px',
    onchange:e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        plan = planImport(rd.result);
        if (plan.error){ setKids(info, h('div', {class:'note bad', text:plan.error})); goBtn.disabled = true; return; }
        const over = docCount() + plan.items.length + (plan.items.some(i => i.opening > 0) ? 1 : 0) > DOC_LIMIT;
        setKids(info,
          h('div', {class:'note', text:'可匯入 ' + plan.items.length + ' 項商品，略過 ' + plan.skipped.length + ' 列。'}),
          over ? h('div', {class:'note bad', text:'匯入後會超過資料量上限（' + DOC_LIMIT + '）。'}) : null,
          plan.skipped.length ? h('ul', null, plan.skipped.slice(0, 8).map(t => h('li', null, h('small', {text:t})))) : null);
        goBtn.disabled = !plan.items.length || over;
      };
      rd.readAsText(f, 'utf-8');
    }});
  goBtn.addEventListener('click', async () => {
    if (!plan || !plan.items.length) return;
    goBtn.disabled = true;
    const opening = []; let done = 0;
    const ok = await run(async () => {
      for (let i = 0; i < plan.items.length; i += 5){
        const chunk = plan.items.slice(i, i + 5);
        const write = () => Promise.all(chunk.map(async it => {
          const ref = S.db.collection('products').doc();
          const {opening:op, ...data} = it;
          await ref.set({...data, active:true, createdBy:S.meId, createdAt:Date.now()});
          if (op > 0) opening.push({pid:ref.id, name:it.name, sku:it.sku, unit:it.unit, qty:op, counted:op, before:0, price:0, cost:it.cost});
        }));
        try { await write(); } catch (e) { if (e && e.code === 'resource_exhausted'){ await new Promise(r => setTimeout(r, 1200)); await write(); } else throw e; }
        done += chunk.length; goBtn.textContent = '匯入中 ' + done + ' / ' + plan.items.length;
      }
      if (opening.length) await createOrder('adjust', {lines:opening, note:'期初庫存匯入'});
      return true;
    });
    goBtn.textContent = '開始匯入';
    if (ok){ toast('已匯入 ' + plan.items.length + ' 項商品'); sh.forceClose(); } else goBtn.disabled = false;
  });
  sh.bodyEl.append(
    h('p', {class:'note', text:'CSV 第一列為欄位名稱：料號、品名、分類、單位、進價、售價、安全庫存、期初庫存、條碼（選填）。料號與品名為必填，重複的料號會略過。'}),
    h('div', {class:'btns', style:'margin-bottom:14px'}, h('button', {class:'btn ghost sm', onclick:() => saveFile('商品匯入範本.csv', csvText([
      ['料號', '品名', '分類', '單位', '進價', '售價', '安全庫存', '期初庫存', '條碼'],
      ['A001', '礦泉水 600ml', '飲料', '瓶', 8, 15, 48, 120, '4710000000017'],
      ['A002', '綠茶 500ml', '飲料', '瓶', 12, 25, 24, 60, '']]))}, icon('down'), '下載範本')),
    fld('選擇 CSV 檔', file), info);
  sh.footEl.append(goBtn);
}

/* ================= 啟動 ================= */
async function init(){
  draw();
  if (!window.claude || !window.claude.use){ S.fatal = '請在 Claude 中開啟這個頁面，才能使用共用資料庫。'; return draw(); }
  const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
  if (!db){ S.fatal = '目前的檢視環境無法使用共用資料庫，請在 Claude 中重新開啟。'; return draw(); }
  S.db = db; S.user = user; S.dl = dl;
  if (user){
    S.me = await user.me(); S.meId = S.me.id;
    const [cw, ce, io] = await Promise.all([user.can('data.write'), user.canEdit(), user.isOwner()]);
    S.canWrite = cw !== false; S.isAdmin = !!(ce || io);
    ensureNames([S.meId]);
  }
  const bad = e => { console.error(e); S.err = e; render(); };
  const watch = (key, path) => db.collection(path).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = {...d.data(), id:d.id}; });
    S[key] = m; S.loaded[key] = true; recompute(); render(key);
  }, bad);
  watch('products', 'products'); watch('partners', 'partners'); watch('orders', 'orders'); watch('payments', 'payments'); watch('notes', 'notes'); watch('counts', 'counts'); watch('countlines', 'countlines'); watch('corders', 'corders'); watch('porders', 'porders'); watch('prules', 'prules'); watch('members', 'members'); watch('vehicles', 'vehicles'); watch('fuellogs', 'fuellogs'); watch('maint', 'maint'); watch('cashbook', 'cashbook'); watch('quotes', 'quotes'); watch('closings', 'closings'); watch('collects', 'collects'); watch('fuelcards', 'fuelcards'); setTimeout(registerMe, 2500);
  db.doc('settings/roles').onSnapshot(snap => { S.roles = snap.exists ? snap.data() : {}; S.loaded.roles = true; render('roles'); }, () => { S.loaded.roles = true; render('roles'); });
  db.doc('settings/backup').onSnapshot(snap => { S.bk = snap.exists ? snap.data() : {}; render('settings'); }, () => {});
  db.doc('settings/slipform_south').onSnapshot(snap => { S.slipCfgS = snap.exists ? snap.data() : {}; render('settings'); }, () => {});
  db.doc('settings/slipform').onSnapshot(snap => { S.slipCfg = snap.exists ? snap.data() : {}; render('settings'); }, () => {});
  db.doc('settings/invoice').onSnapshot(snap => { S.invCfg = snap.exists ? snap.data() : {}; render('settings'); }, () => {});
  db.doc('settings/main').onSnapshot(snap => {
    S.setRaw = snap.exists ? snap.data() : {}; S.set = {...SET_DEFAULT, ...S.setRaw};
    S.loaded.settings = true; render('settings');
  }, bad);
}
init();
})();
